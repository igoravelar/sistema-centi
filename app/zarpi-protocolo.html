<!DOCTYPE html>
<html lang="pt-BR">
<head>

<link rel="icon" type="image/svg+xml" href="assets/img/zarpi/ico-favicon-zarpi.svg">

<link rel="stylesheet" href="assets/menu.css?v=4">
</head>
<body>

<div class="app"></div>

<script src="assets/shell.js?v=22"></script>
<script src="assets/preferencias.js?v=1"></script>
<script src="assets/zarpi.js?v=3"></script>
<script>
/* ícones extras usados só nesta tela */
Object.assign(ICO, {
  grade:      '<path d="M9 5H2v5h7V5z"/><path d="M15 5h7v5h-7V5z"/><path d="M9 14H2v5h7v-5z"/><path d="M15 14h7v5h-7v-5z"/>',
  envelope:   '<rect x="2" y="5" width="20" height="14" rx="2"/><polyline points="22,7 12,14 2,7"/>',
  cubo:       '<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.3,7 12,12 20.7,7"/><line x1="12" y1="22" x2="12" y2="12"/>',
  ajustes:    '<line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="8" cy="17" r="2"/>',
  enviar:     '<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22,2 15,22 11,13 2,9"/>',
  entrada:    '<polyline points="22,12 16,12 14,15 10,15 8,12 2,12"/><path d="M5.5 5.5 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.5A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.5z"/>',
  arquivar:   '<rect x="2" y="4" width="20" height="5" rx="1"/><path d="M4 9v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9"/><line x1="10" y1="13" x2="14" y2="13"/>',
  prancheta:  '<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3h6v1"/><line x1="9" y1="10" x2="15" y2="10"/><line x1="9" y1="14" x2="13" y2="14"/>',
  natureza:   '<path d="M12 21c-5-3-8-6.5-8-10a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 3.5-3 7-8 10z"/>',
  versao:     '<circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="7" r="2"/><path d="M6 7v10"/><path d="M18 9a6 6 0 0 1-6 6H6"/>',
});

const CAST = [
  { titulo: 'CENTICAST | Tramitação e Encaminhamento', autor: 'Marcos Louriano' },
  { titulo: 'FLUXO INTELIGENTE NO PROTOCOLO DIGITAL',  autor: 'Eduardo Soares' },
  { titulo: 'SOLICITAÇÕES NO PORTAL DO CONTRIBUINTE',  autor: 'Ana Soares' },
  { titulo: 'CONSULTA PROCESSUAL DESCOMPLICADA',       autor: 'Centi' },
];

/* Só as telas do módulo Protocolo do ERP que o Zarpi usa: as do fluxo
   inteligente e as do dia a dia que o fluxo conduz (o processo, a remessa
   com destino previsto, a caixa da repartição, o arquivamento no Fim) e a
   natureza, que diz qual fluxo o processo segue, além dos parâmetros gerais
   do módulo (numeração, sigiloso, portal), que valem também para o Zarpi. Fonte: "Guia do Protocolo",
   guia das telas para o analista, novembro de 2026. */
const MODULOS_MENU = [
  {
    classe: 'remessa', titulo: 'Protocolo e Remessa', ico: 'envelope',
    itens: [
      { txt: 'Protocolo',                      cod: 'PO002', ico: 'lapis', fav: true },
      { txt: 'Remessas de saída',              cod: 'PO003', ico: 'enviar' },
      { txt: 'Entrada de remessas',            cod: 'PO004', ico: 'entrada' },
      { txt: 'Arquivar/desarquivar protocolo', cod: 'PO009', ico: 'arquivar' },
      { txt: 'Tela Protocolo',                 cod: 'PO011', ico: 'monitor', fav: true },
    ],
  },
  {
    classe: 'gestao', titulo: 'Fluxo Inteligente', ico: 'fluxograma',
    itens: [
      { txt: 'Fluxo do processo',            cod: 'PO050', ico: 'fluxo', href: 'po050.html?app=zarpi', fav: true },
      { txt: 'Tramitação de protocolo',      cod: 'PO051', ico: 'tramitacao', href: 'po051.html?app=zarpi' },
      { txt: 'Modelo de documento',          cod: 'PO052', ico: 'arquivo', fav: true },
      { txt: 'Configuração de auditoria',    cod: 'PO053', ico: 'prancheta', fav: true },
      { txt: 'Feriado',                      cod: 'PO055', ico: 'calendario', fav: true },
      { txt: 'Versionamento da natureza',    cod: 'PO056', ico: 'versao' },
      { txt: 'Importar fluxo da biblioteca', cod: 'PO057', ico: 'download' },
      { txt: 'Delegação',                    cod: 'PO058', ico: 'pessoas' },
      { txt: 'Cubo etapas do fluxo',         cod: 'PO060', ico: 'cubo' },
    ],
  },
  {
    classe: 'configuracoes', titulo: 'Configurações', ico: 'ajustes',
    itens: [
      { txt: 'Configuração protocolo', cod: 'PO023', ico: 'ajustes' },
      { txt: 'Natureza',               cod: 'PO001', ico: 'natureza' },
    ],
  },
];

const TAGS = { video: 'VÍDEO', novo: 'NOVO', treino: 'TREINO' };

function itemHTML(it) {
  const tag = it.tag ? `<span class="tag ${it.tag}">${TAGS[it.tag]}</span>` : '';
  const alvo = it.href ? ` onclick="location.href='${it.href}'"` : '';
  return `
    <div class="menu-item" data-busca="${(it.txt + ' ' + it.cod).toLowerCase()}"${alvo}>
      ${tag}
      <span class="menu-item-favorite${it.fav ? ' ativo' : ''}"
            onclick="event.stopPropagation();this.classList.toggle('ativo')">${ESTRELA}</span>
      <span class="menu-item-icon">${svg(it.ico)}</span>
      <span class="menu-item-text">${it.txt}</span>
      <span class="menu-item-code">${it.cod}</span>
    </div>`;
}

function menuHTML() {
  const cards = MODULOS_MENU.map(m => `
    <section class="module ${m.classe}">
      <div class="module-header">
        <div class="module-icon">${svg(m.ico)}</div>
        <div class="module-title">${m.titulo}</div>
      </div>
      ${m.itens.map(itemHTML).join('')}
    </section>`).join('');

  const cast = CAST.map(c => `
    <div class="webcast-item">
      <div class="webcast-title">${svg('play')}<span>${c.titulo}</span></div>
      <div class="webcast-details">${c.autor}</div>
    </div>`).join('');

  return `
  <div class="menu">
    <div class="menu-header">
      <div>
        <h1><span class="header-icon">${svg('grade')}</span> Protocolo</h1>
        <div class="search-container">
          <input class="search-input" placeholder="Buscar funcionalidades..." oninput="filtrar(this.value)">
          <span class="search-icon">${svg('lupa')}</span>
        </div>
      </div>
      <div class="centi-cast">
        <div class="centi-cast-badge">${svg('play', 'width="12" height="12"')} Centi Cast</div>
        <div class="webcast-list">${cast}</div>
      </div>
    </div>
    <div class="menu-grid">${cards}</div>
  </div>`;
}

/** Filtra os itens do menu pelo texto ou código da funcionalidade. */
function filtrar(termo) {
  const t = termo.trim().toLowerCase();
  document.querySelectorAll('.module').forEach(mod => {
    let visiveis = 0;
    mod.querySelectorAll('.menu-item').forEach(it => {
      const bate = !t || it.dataset.busca.includes(t);
      it.hidden = !bate;
      if (bate) visiveis++;
    });
    mod.style.display = visiveis ? '' : 'none';
  });
}

const main = montarShell('protocolo', vestirZarpi());
main.insertAdjacentHTML('beforeend', `<div class="tela">${menuHTML()}</div>`);
</script>
</body>
</html>
