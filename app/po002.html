<style>
  /* -------------------------------- Pesquisa -------------------------------- */
  .filtros { padding: 14px 16px; position: relative; }
  /* deixa livre a faixa da direita ocupada pelo box "Últimas Buscas" (330px + margens) */
  .filtros-grid { display: grid; grid-template-columns: 240px 240px 1fr 30px; gap: 10px 12px;
                  max-width: min(1010px, calc(100% - 358px)); }
  .filtros-grid .cab { font-size: 13px; font-weight: bold; color: var(--txt); text-align: center; }
  .filtros-grid select, .filtros-grid input {
    height: 32px; border: 1px solid var(--fld-bd); border-radius: 4px;
    padding: 0 10px; color: var(--txt); background: #FFFFFF; outline: none; width: 100%;
  }
  .filtros-grid select:focus, .filtros-grid input:focus { border-color: var(--g); }
  .filtros .remover { border: 0; background: none; color: #E53935; display: grid; place-items: center; }
  .filtros .remover svg { width: 15px; height: 15px; }
  /* as quatro ações dos filtros ficam juntas, encostadas na direita — o
     max-width é o que impede que elas passem por baixo das Últimas Buscas */
  .filtros .acoes { display: flex; justify-content: flex-end; align-items: center;
                    gap: 20px; margin-top: 14px;
                    max-width: min(1010px, calc(100% - 358px)); }
  .filtros .link { border: 0; background: none; color: var(--g-dark); font-size: 13px; display: inline-flex; align-items: center; gap: 7px; }
  .filtros .link.cinza { color: var(--txt); }
  .filtros .link svg { width: 14px; height: 14px; }

  .ultimas {
    position: absolute; top: 14px; right: 16px; width: 330px;
    background: #FFFFFF; border: 1px solid var(--tab-bd); border-radius: 5px; padding: 10px 14px;
  }
  .ultimas h3 { margin: 0 0 8px; font-size: 13px; font-weight: bold; color: var(--txt); display: flex; align-items: center; gap: 8px; }
  .ultimas h3 svg { width: 14px; height: 14px; }
  .ultimas li { list-style: none; font-size: 12px; padding: 5px 0; color: var(--txt);
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .ultimas li:hover { color: var(--g-dark); }
  .ultimas ul { margin: 0; padding: 0; }

  .res-topo { display: flex; align-items: center; gap: 12px; padding: 12px 16px; flex: 0 0 auto; }
  .res-topo h2 { margin: 0; font-size: 18px; font-weight: bold; color: var(--txt); }
  .res-topo .conta { font-size: 13px; color: var(--txt); }
  .res-topo .dir { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .res-topo select { height: 32px; border: 1px solid var(--fld-bd); border-radius: 4px; padding: 0 8px; background: #FFFFFF; color: var(--txt); }
  .res-corpo { flex: 1; min-height: 0; margin: 0 12px 12px; background: #FFFFFF; border: 1px solid var(--tab-bd); border-radius: 4px; overflow: auto; }

  /* -------------------------------- Cadastro --------------------------------
     Um container só: a coluna da esquerda (título + pastas) atravessa a faixa
     cinza, e a linha que a separa do formulário sobe até o topo. */
  /* a divisória só existe no PO002, por causa da coluna de pastas embaixo */
  .cad-topo .esq { border-right: 1px solid var(--tab-bd); }
  .cad-corpo { flex: 1; min-height: 0; display: flex; }

  .arvore { flex: 0 0 240px; overflow: auto; padding: 12px 10px; border-right: 1px solid var(--tab-bd); }
  .arvore .pasta { display: flex; align-items: center; gap: 9px; font-size: 12px; color: #5C5B5B;
                   padding: 7px 4px; border-radius: 4px; cursor: pointer; }
  .arvore .pasta:hover { background: #F1F5E4; }
  .arvore .pasta .chev { flex: 0 0 13px; display: flex; }
  .arvore .pasta .chev svg { width: 13px; height: 13px; color: var(--g); }
  .arvore .pasta .ico { flex: 0 0 15px; display: flex; }
  .arvore .pasta .ico svg { width: 15px; height: 15px; color: var(--g); }
  .arvore .n1 { padding-left: 22px; }
  .arvore .n2 { padding-left: 44px; }
  .arvore .pasta.sel { background: var(--g-soft-bg); color: var(--g-olive); font-weight: bold; }

  .form { flex: 1; min-width: 0; max-width: 576px; display: flex; flex-direction: column; gap: 10px;
          overflow: auto; padding: 14px 16px; }

  /* Coluna das pastas: a árvore rola e a seção Conversas fica presa no pé */
  .col-pastas { flex: 0 0 240px; min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--tab-bd); }
  .col-pastas .arvore { flex: 1; min-height: 0; border-right: 0; }
  .conversas { flex: 0 0 auto; border-top: 1px solid var(--tab-bd); }
  .conversas .cab { display: flex; align-items: center; gap: 9px; padding: 11px 14px; background: #F4F6EE;
                    font-size: 12.5px; font-weight: bold; color: #5C5B5B; cursor: pointer; }
  .conversas .cab:hover, .conversas.ativa .cab { background: var(--g-soft-bg); }
  .conversas .cab svg { width: 13px; height: 13px; color: var(--g); flex: 0 0 auto; }
  .conversas .cab svg.balao { width: 15px; height: 15px; color: #5C5B5B; }
  .conversas .vazio { margin: 0; padding: 9px 14px 11px 36px; font-size: 11px; font-style: italic; color: var(--txt); }

  /* ----------------------------- Conversas ----------------------------- */
  .conv { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .conv-topo { flex: 0 0 auto; display: flex; align-items: center; gap: 14px; padding: 8px 14px; background: #FFFFFF; border-bottom: 1px solid #E4E4E4; }
  .conv-marca { flex: 0 0 34px; width: 34px; height: 34px; border-radius: 50%; background: #E7F4D6; color: var(--g-dark); display: grid; place-items: center; }
  .conv-marca svg { width: 17px; height: 17px; }
  .conv-tit { white-space: nowrap; }
  .conv-tit b { display: block; font-size: 13px; color: #4A4A4A; }
  .conv-tit span { display: inline-flex; align-items: center; gap: 5px; margin-top: 2px; font-size: 11px; color: var(--txt); cursor: pointer; }
  .conv-tit span b { display: inline; font-size: 11px; }
  .conv-tit span svg { width: 11px; height: 11px; color: var(--g); }
  /* aviso numa linha só, da altura do botão, encostado no Novo Grupo */
  .conv-aviso { margin-left: auto; min-width: 0; height: 29px; display: flex; align-items: center; gap: 8px; padding: 0 12px;
                border: 1px dashed var(--g); border-radius: 6px; background: #FAFDF0; font-size: 12px; color: #5C5B5B; white-space: nowrap; }
  .conv-aviso span { overflow: hidden; text-overflow: ellipsis; }
  .conv-aviso svg { flex: 0 0 16px; width: 16px; height: 16px; color: var(--g-dark); }
  .conv-aviso .fechar-aviso { flex: 0 0 18px; width: 18px; height: 18px; margin-left: 2px; padding: 0; border: 0; border-radius: 50%; background: none;
                              color: #8A8A8A; display: grid; place-items: center; cursor: pointer; }
  .conv-aviso .fechar-aviso svg { width: 12px; height: 12px; flex: 0 0 12px; color: currentColor; }
  .conv-aviso .fechar-aviso:hover { background: #EEF4DC; color: var(--g-dark); }
  /* sinal de proibido sobre o robô do Vicenti: círculo e corte em verde */
  .proibido { position: relative; flex: 0 0 22px; width: 22px; height: 22px; display: grid; place-items: center; }
  .proibido svg { width: 13px; height: 13px; flex: 0 0 13px; }
  .proibido::before { content: ''; position: absolute; inset: 0; border: 2px solid var(--g-dark); border-radius: 50%; }
  .proibido::after { content: ''; position: absolute; top: 50%; left: 1px; right: 1px; height: 2px; margin-top: -1px; background: var(--g-dark); transform: rotate(-45deg); }
  .conv-aviso b { color: var(--g-dark); }
  .conv-topo .btn { flex: 0 0 auto; margin-left: auto; }
  .conv-aviso + .btn { margin-left: 0; }
  /* corpo do chat: a faixa fixa desliza por baixo do título, por cima das falas */
  .conv-corpo { position: relative; flex: 1; min-height: 0; display: flex; overflow: hidden; }
  .conv-msgs { position: relative; flex: 1; min-height: 0; overflow: auto; padding: 24px 24px 20px; }
  .conv-falas { margin-top: 28px; }
  .conv-falas:empty { display: none; }
  .conv-faixa { position: absolute; top: 0; left: 0; right: 0; z-index: 2; display: flex; align-items: center; gap: 10px;
                height: 34px; padding: 0 8px 0 16px; background: #FFFFFF; border-bottom: 1px solid #E4E4E4;
                box-shadow: 0 2px 6px rgba(0,0,0,.06); transform: translateY(-100%); visibility: hidden;
                transition: transform .3s ease-in-out, visibility .3s; }
  .conv-faixa.visivel { transform: none; visibility: visible; }
  .conv-faixa p { flex: 1; min-width: 0; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11.5px; color: #4A4A4A; }
  .conv-faixa p strong { color: #4A4A4A; }
  .conv-faixa button { flex: 0 0 26px; width: 26px; height: 26px; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--g-dark);
                       display: grid; place-items: center; cursor: pointer; }
  .conv-faixa button:hover { background: var(--g-soft-bg); }
  .conv-faixa button svg { width: 15px; height: 15px; }
  .conv-vazio { max-width: 470px; margin: 0 auto; text-align: center; color: #5C5B5B; font-size: 13px; line-height: 1.7; }
  /* ícone grande ao lado do título em duas linhas */
  .conv-vazio .cabeca { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 16px; }
  .conv-vazio .cabeca svg { width: 64px; height: 64px; color: var(--btp-bg); }
  .conv-vazio h3 { margin: 0; text-align: left; font-size: 22px; line-height: 1.15; font-weight: bold; color: #4A4A4A; }
  .conv-vazio p { margin: 0 0 12px; }
  .conv-vazio b { font-weight: normal; }
  .conv-vazio p.menor { font-size: 12px; }
  /* quadro de atenção: o fone à esquerda, separado por um filete, e a orientação do suporte */
  .atencao { display: flex; align-items: stretch; margin-top: 22px; border: 1px solid var(--g); border-radius: 8px;
             text-align: left; }
  .atencao .rot { flex: 0 0 auto; display: flex; align-items: center; padding: 0 14px; border-right: 1px solid var(--g); color: var(--g-dark); }
  .atencao .rot svg { width: 26px; height: 26px; }
  .atencao p { margin: 0; padding: 9px 14px; font-size: 11px; line-height: 1.6; color: #5C5B5B; }
  .atencao em { font-style: normal; font-weight: bold; color: var(--g-dark); }
  .conv-vazio strong { color: #4A4A4A; }
  .conv-vazio hr { width: 56px; margin: 16px auto; border: 0; border-top: 2px solid #C9DA9C; }
  .conv .chat-input { border-top: 1px solid #E4E4E4; }
</style>

    <div class="res-topo">
      <h2>Resultados</h2>
      <span class="conta">Exibindo ${RESULTADOS.length} de ${RESULTADOS.length}</span>
      <div class="dir">
        <span>Mostrar:</span>
        <select><option>50</option><option>100</option></select>
        <button class="btn btn-claro">${svg('download')} Exportar</button>
      </div>
    </div>
    <div class="res-corpo scroll">
      <table class="tabela">
        <thead><tr>${COLUNAS.map(c => `<th>${c}</th>`).join('')}</tr></thead>
        <tbody>${linhas}</tbody>
      </table>
    </div>
  </div>`;
}

/* ------------------------------- Cadastro ------------------------------- */

function campo({ rot, val, ro = true, cod, acoes = [], alto = false, ph = '' }) {
  // no Cadastro a coluna de código do lookup tem 71px (no drawer do PO011 são 42px)
  const codBox = cod !== undefined
    ? `<input class="cx cod cod-l${ro ? ' ro' : ''}" value="${cod}" ${ro ? 'readonly' : ''}>` : '';
  const acts = acoes.map(a => `<button class="act" title="${a.t}">${svg(a.i)}</button>`).join('');
  return `
    <div class="campo"${alto ? ' style="min-height:46px"' : ''}>
      <div class="rot">${rot}</div>
      <div class="val">
        ${codBox}
        <input class="cx${ro ? ' ro' : ''}" value="${val}" placeholder="${ph}" ${ro ? 'readonly' : ''}>
        ${acts}
      </div>
    </div>`;
}

function cadastroHTML() {
  const pastas = PASTAS.map(p => `
    <div class="pasta n${p.n}${p.sel && painel === 'form' ? ' sel' : ''}" onclick="abrirPainel('form')">
      <span class="chev">${p.chev ? fa(p.chev === 'baixo' ? 'chevronBaixo' : 'chevronDireita') : ''}</span>
      <span class="ico">${fa('pasta')}</span>
      <span>${p.txt}</span>
    </div>`).join('');

  const campos = [
    campo({ rot: 'Id', val: '2292412' }),
    campo({ rot: 'Protocolo<span class="req">*</span>', val: '1990' }),
    campo({ rot: 'Ano Protocolo<span class="req">*</span>', val: '2026' }),
    campo({ rot: 'Data Protocolo', val: '06/01/2026' }),
    campo({ rot: 'Interessado/<br>Beneficiário', cod: '94886', val: 'FUNDO MUNICIPAL DE SAUDE DE RIO VERDE',
            ro: false, alto: true,
            acoes: [{ i: 'lapis', t: 'Editar' }, { i: 'mais', t: 'Novo' }, { i: 'lupa', t: 'Pesquisar' }] }),
    campo({ rot: 'Solicitante/<br>Requerente', cod: '1595202', val: 'SMS - UPA II - UNIDADE DE PRONTO ATENDIMENTO',
            ro: false, alto: true,
            acoes: [{ i: 'lapis', t: 'Editar' }, { i: 'lupa', t: 'Pesquisar' }] }),
    campo({ rot: 'Natureza<span class="req">*</span>', cod: '', val: '', ro: false, ph: 'Pesquisar...',
            acoes: [{ i: 'lupa', t: 'Pesquisar' }] }),
  ].join('');

  return `
  <div class="cad">
    <div class="cad-topo">
      <div class="esq">
        ${fa('chevronBaixo')}${fa('check')}
        <span class="nome">Protocolo - 2292412</span>
      </div>
      <div class="dir">
        <button class="btn btn-claro">${svg('mais')} Novo</button>
        <button class="btn btn-claro">${svg('lixeira')} Excluir</button>
        <button class="btn btn-claro">${svg('salvar')} Salvar</button>
        <div style="flex:1"></div>
        <a class="btn btn-primario" href="po051.html?view=cadastro">${svg('fluxograma')} Guia do Fluxo</a>
        <button class="btn btn-primario">${svg('gerais')} Operações</button>
      </div>
    </div>

    <div class="cad-corpo">
      <div class="col-pastas">
        <div class="arvore scroll">${pastas}</div>
        <div class="conversas${painel === 'conversas' ? ' ativa' : ''}">
          <div class="cab" onclick="abrirPainel('conversas')">${fa('chevronDireita')}${fa('comentarios').replace('<svg', '<svg class="balao"')} Conversas</div>
          <p class="vazio">Sem conversas privadas.</p>
        </div>
      </div>
      ${painel === 'conversas' ? conversasHTML() : `<div class="form scroll">${campos}</div>`}
    </div>
  </div>`;
}

/* ------------------------------- Conversas -------------------------------
   Chat interno do protocolo, aberto pela seção Conversas no pé das pastas.
   Ainda sem grupo: mostra o estado vazio com a orientação de uso. */

let painel = 'form';
let avisoFechado = false;   /* o aviso do Vicenti, uma vez fechado, não volta nesta visita */   /* o que ocupa o lado direito do Cadastro: 'form' ou 'conversas' */

function abrirPainel(qual) { painel = qual; render(); }
function fecharAviso() { avisoFechado = true; render(); }

function conversasHTML() {
  return `
  <div class="conv">
    <div class="conv-topo">
      <span class="conv-marca">${fa('comentarios')}</span>
      <div class="conv-tit">
        <b>Conversas entre Servidores Públicos</b>
        <span>${svg('usuario')} Chat com <b>1</b> participante ${svg('chevronBaixo')}</span>
      </div>
      ${avisoFechado ? '' : `<div class="conv-aviso"><span class="proibido">${svg('robo')}</span><span>Este <b>NÃO</b> é o chat do Vicenti ou do Suporte Centi.</span><button class="fechar-aviso" type="button" title="Fechar aviso" onclick="fecharAviso()">${svg('x')}</button></div>`}
      <button class="btn btn-claro">${svg('pessoas')} Novo Grupo</button>
    </div>
    <div class="conv-corpo">
    <div class="conv-faixa" id="conv-faixa">
      <p><strong>Conversas internas:</strong> Este chat é destinado apenas para conversas internas entre usuários do sistema Centi a respeito do registro acessado.</p>
      <button type="button" title="Dispensar" onclick="dispensarFaixa()">${svg('pin')}</button>
    </div>
    <div class="conv-msgs fundo-pontos scroll" id="conv-msgs" onscroll="conferirFaixa()">
      <div class="conv-vazio" id="conv-intro">
        <div class="cabeca">${fa('comentarios')}<h3>Conversas<br>Internas</h3></div>
        <p>Este chat é destinado apenas para conversas internas entre usuários do sistema Centi a respeito do registro acessado.</p>
        <hr>
        <p class="menor"><strong>Conversas públicas:</strong> todas as pessoas que entrarem neste registro irão ver e realizar comentários.</p>
        <p class="menor"><strong>Conversas privadas:</strong> crie um <b>NOVO GRUPO</b> selecionando as pessoas com quem deseja conversar reservadamente sobre o registro.</p>
        <div class="atencao">
          <span class="rot" title="Atenção">${svg('fone')}</span>
          <p>Para falar com um atendente do Suporte CENTI, acesse a aba <em>VICENTI</em>, selecione <em>Orientação</em> e escreva sua dúvida.</p>
        </div>
      </div>
      <div class="conv-falas" id="conv-falas">${falasConv.map(falaHTML).join('')}</div>
    </div>
    </div>
    <div class="chat-input">
      <div class="linha">
        <input type="text" id="conv-texto" placeholder="Digite aqui..." onkeydown="if (event.key === 'Enter') enviarFala()">
        <button class="clipe" title="Anexar arquivo">${svg('clipe')}</button>
        <button class="enviar" title="Enviar" onclick="enviarFala()">${fa('enviar')}</button>
      </div>
    </div>
  </div>`;
}

/* Falas: as minhas entram em balões verdes, à direita, embaixo da mensagem
   inicial. A mensagem começa centrada e sobe com a rolagem à medida que a
   conversa cresce; quando ela sai de vista, a faixa fixa desce do título. */
const EU = { quem: 'Igor Avelar', ini: 'IA', cor: '#25C35F' };
let falasConv = [];          /* falas desta visita */
let faixaDispensada = false; /* o pino recolhe a faixa de vez */

const escapar = t => t.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

function falaHTML(f) {
  return `
    <div class="fala eu">
      <div class="cab"><span class="avatar" style="background:${EU.cor}">${EU.ini}</span><b>${EU.quem}</b></div>
      <div class="bolha">${f.txt}</div>
      <div class="hora">${svg('relogio')}<span>${f.hora}</span></div>
    </div>`;
}

function enviarFala() {
  const campo = document.getElementById('conv-texto');
  const txt = campo.value.trim();
  if (!txt) return;
  const agora = new Date();
  const f = { txt: escapar(txt), hora: agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) };
  falasConv.push(f);
  document.getElementById('conv-falas').insertAdjacentHTML('beforeend', falaHTML(f));
  campo.value = '';
  campo.focus();
  const msgs = document.getElementById('conv-msgs');
  msgs.scrollTo({ top: msgs.scrollHeight, behavior: 'smooth' });
}

/* a mensagem inicial nasce centrada: o recuo de cima é calculado só por ela,
   então as falas ocupam o espaço de baixo e, quando ele acaba, empurram tudo */
function ajustarConversa() {
  const msgs = document.getElementById('conv-msgs');
  if (!msgs) return;
  const intro = document.getElementById('conv-intro');
  msgs.style.paddingTop = Math.max(24, (msgs.clientHeight - intro.offsetHeight) / 2) + 'px';
  msgs.scrollTop = msgs.scrollHeight;
  conferirFaixa();
}

function conferirFaixa() {
  const msgs = document.getElementById('conv-msgs');
  const faixa = document.getElementById('conv-faixa');
  if (!msgs || !faixa) return;
  const intro = document.getElementById('conv-intro');
  const sumiu = intro.offsetTop + intro.offsetHeight - msgs.scrollTop < 0;
  faixa.classList.toggle('visivel', sumiu && !faixaDispensada);
}

function dispensarFaixa() {
  faixaDispensada = true;
  conferirFaixa();
}

addEventListener('resize', ajustarConversa);

/* --------------------------------- shell --------------------------------- */

const VTABS = [
  { id: 'pesquisa', rot: 'Pesquisa', ico: 'lupa' },
  { id: 'cadastro', rot: 'Cadastro', ico: 'lapis' },
  { id: 'notas',    rot: 'Notas',    ico: 'notas' },
  { id: 'vicenti',  rot: 'ViCenti',  ico: 'robo' },
];

let vista = 'pesquisa';

function render() {
  const vt = VTABS.map(v => `
    <button class="vtab${v.id === vista ? ' ativa' : ''}" onclick="irPara('${v.id}')">
      ${svg(v.ico)}<span>${v.rot}</span>
    </button>`).join('');

  const corpo = vista === 'cadastro' ? cadastroHTML()
              : vista === 'pesquisa' ? pesquisaHTML()
              : `<div class="painel" style="flex:1;display:grid;place-items:center;color:var(--txt-mute)">
                   ${VTABS.find(v => v.id === vista).rot} — em construção
                 </div>`;

  main.querySelector('.tela')?.remove();
  main.insertAdjacentHTML('beforeend',
    `<div class="tela"><div class="vtabs">${vt}</div><div class="conteudo">${corpo}</div></div>`);
  ajustarConversa();
}

function irPara(id) { vista = id; render(); }

/** Clique numa linha de resultado leva ao Cadastro do protocolo. */
function abrirCadastro(i) { irPara('cadastro'); }

const main = montarShell('po002');

/* retoma a vista em que a aba estava; o ?view, quando vem, vence depois */
const ESTADO_B = lerEstado('po002');
if (ESTADO_B && ESTADO_B.vista) vista = ESTADO_B.vista;
if (ESTADO_B && ESTADO_B.painel) painel = ESTADO_B.painel;

render();

/* estado inicial via ?view=cadastro */
const q = new URLSearchParams(location.search).get('view');
if (new URLSearchParams(location.search).get('painel') === 'conversas') painel = 'conversas';
if (q && VTABS.some(v => v.id === q)) irPara(q);

guardarEstadoAoSair('po002', () => ({ vista, painel }));
</script>
