<style>
* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  font-family: "Open Sans", Verdana, Geneva, sans-serif;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 42px;
  padding: 40px 20px;
  background: linear-gradient(180deg, #e8ef9e 0%, #9dbb1d 100%);
  overflow: hidden;
}

/* grafismo de fluxogramas ao fundo (parte central e baixa da tela) */
.grafismo {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  width: 100%;
  height: 62vh;
  z-index: 0;
  pointer-events: none;
}

.marca, h1, fieldset {
  position: relative;
  z-index: 1;
}

.marca img {
  width: min(320px, 70vw);
  display: block;
}

h1 {
  margin: 0;
  font-size: 32px;
  font-weight: 800;
  color: #FFFFFF;
  text-align: center;
  text-shadow: 0 1px 3px rgba(0, 0, 0, .14);
}

fieldset {
  margin: 0;
  padding: 28px 32px;
  width: min(360px, 100%);
  border: 2px solid rgba(255, 255, 255, .75);
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

legend {
  padding: 0 10px;
  color: #FFFFFF;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
}

/* botão claro com moldura verde e sombra sólida no rodapé (volume) */
.botao {
  display: block;
  padding: 18px 22px;
  background: #F3FFC3;
  border: 2px solid #9BB61A;
  border-radius: 12px;
  color: #6D8415;
  font-size: 22px;
  font-weight: 700;
  text-align: center;
  text-decoration: none;
  box-shadow: 0 6px 0 #9BB61A;
  transition: transform .1s ease, box-shadow .1s ease;
}

.botao:hover {
  background: #9BB61A;
  border-color: #7F9612;
  color: #FFFFFF;
  box-shadow: 0 6px 0 #7F9612;
}

.botao:active {
  transform: translateY(6px);
  box-shadow: 0 0 0 #9BB61A;
}
</style>
</head>
