<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal de Assinaturas — Centi</title>
<link rel="icon" type="image/svg+xml" href="assets/img/ico-favicon-centi-prototipo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 16px; background: #F2F3EF; font-family: "Open Sans", Verdana, Geneva, sans-serif; color: #2B3445; }

  .coluna { width: 100%; max-width: 460px; }
  /* O título ocupa a largura do box: o script ajusta o tamanho da fonte */
  h1 { margin: 0 0 6px; font-size: 38px; font-weight: 800; letter-spacing: -.3px; line-height: 1.15; color: #2B3445; text-align: center; white-space: nowrap; }
  .sub { margin: 0 0 24px; font-size: 14px; color: #6B7280; text-align: center; }

  .card { width: 100%; background: #F8F9FB; border: 1px solid #DDE1E8; border-radius: 12px; box-shadow: 0 2px 10px rgba(43,52,69,.06); overflow: hidden; }

  /* Abas grandes no topo do box: a aberta se funde com o formulário */
  .abas { display: grid; grid-template-columns: 1fr 1fr; background: #E9EBE4; }
  .aba {
    position: relative; padding: 14px 12px; border: 0; border-bottom: 1px solid #DDE1E8; background: transparent;
    font-family: inherit; font-size: 13px; font-weight: 400; line-height: 1.35; color: #6B7280; cursor: pointer; transition: background .2s, color .2s;
  }
  .aba strong { display: block; font-size: 14px; font-weight: 700; }
  .aba + .aba { border-left: 1px solid #DDE1E8; }
  .aba:hover { color: #4F5B6E; background: #F0F2EC; }
  .aba.ativa { background: #F8F9FB; color: #7D9C2F; border-bottom-color: transparent; cursor: default; }
  .aba.ativa::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: #9BBF2E; }

  form { padding: 24px 26px 26px; }
  .campo { margin-bottom: 16px; }
  .campo label { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 700; color: #5F6878; }
  .caixa { position: relative; }
  .campo input {
    width: 100%; height: 42px; padding: 0 12px; border: 1px solid #DDE1E8; border-radius: 6px; background: #EEF0F4;
    font-family: inherit; font-size: 14px; font-weight: 600; color: #2B3445; outline: none; transition: border-color .2s, box-shadow .2s, background .2s;
  }
  .campo input::placeholder { color: #94A0B4; font-weight: 600; }
  .campo input:focus::placeholder { color: transparent; }
  .campo input:focus { background: #FFFFFF; border-color: #9BBF2E; box-shadow: 0 0 0 3px rgba(155,191,46,.2); }
  .caixa input { padding-right: 44px; }
  .olho { position: absolute; top: 0; right: 0; width: 44px; height: 42px; border: 0; background: none; color: #6B7280; font-size: 15px; cursor: pointer; }
  .olho:hover { color: #2B3445; }

  .esqueceu { display: block; margin: -4px 0 18px auto; width: max-content; font-size: 13px; color: #6B7280; text-decoration: underline; text-underline-offset: 2px; transition: color .2s; }
  .esqueceu:hover { color: #9BBF2E; }

  .btn { display: block; width: 100%; height: 46px; border-radius: 6px; font-family: inherit; font-size: 15px; font-weight: 800; text-transform: uppercase; letter-spacing: .4px; cursor: pointer; transition: background .2s, border-color .2s; }
  .btn.primario { border: 0; background: #9BBF2E; color: #FFFFFF; box-shadow: 0 2px 6px rgba(93,106,56,.2); }
  .btn.primario:hover { background: #7D9C2F; }
  .btn.contorno { border: 1px solid #DDE1E8; background: #F8F9FB; color: #2B3445; font-size: 14px; }
  .btn.contorno:hover { border-color: #9BBF2E; background: #FFFFFF; }

  .ou { display: flex; align-items: center; gap: 14px; margin: 18px 0; font-size: 13px; color: #94A0B4; }
  .ou::before, .ou::after { content: ""; flex: 1; height: 1px; background: #DDE1E8; }

  footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 18px; font-size: 12px; color: #94A0B4; }
  footer img { display: block; height: 24px; width: auto; }

  @media (max-width: 480px) {
    form { padding: 20px 18px; }
    .aba { font-size: 12px; }
  }
</style>
</head>
<body>

<div class="coluna">
<h1 id="titulo">Portal de Assinaturas</h1>
<p class="sub">Faça login para acessar sua conta</p>

<main class="card">
  <div class="abas" role="tablist" aria-label="Tipo de acesso">
    <button class="aba ativa" type="button" role="tab" data-acesso="contribuinte" data-label="CPF ou e-mail" data-placeholder="Digite seu CPF ou e-mail" aria-selected="true">Acessar como<strong>Contribuinte/Fornecedor</strong></button>
    <button class="aba" type="button" role="tab" data-acesso="servidor" data-label="Usuário" data-placeholder="Digite seu usuário" aria-selected="false">Acessar como<strong>Servidor Público</strong></button>
  </div>

  <form id="entrar">
    <div class="campo">
      <label for="login">CPF ou e-mail</label>
      <input id="login" type="text" placeholder="Digite seu CPF ou e-mail" autocomplete="username">
    </div>
    <div class="campo">
      <label for="senha">Senha</label>
      <div class="caixa">
        <input id="senha" type="password" placeholder="Digite sua senha" autocomplete="current-password">
        <button class="olho" type="button" title="Mostrar senha" aria-label="Mostrar senha"><i class="fas fa-eye"></i></button>
      </div>
    </div>
    <a class="esqueceu" href="#">Esqueceu a senha?</a>
    <button class="btn primario" type="submit">Entrar</button>
    <div class="ou">OU</div>
    <button class="btn contorno" type="button">Cadastre-se</button>
  </form>
</main>

<footer>
  <span>© 2026 Centi. Todos os direitos reservados.</span>
  <a href="index.html" title="Ir para o ERP Centi"><img src="uploads/marca-centi.png" alt="Centi"></a>
</footer>
</div>

<script>
/* Título do tamanho do box do formulário */
const titulo = document.getElementById('titulo');
function ajustarTitulo() {
  titulo.style.fontSize = '';
  const base = parseFloat(getComputedStyle(titulo).fontSize);
  const r = document.createRange(); r.selectNodeContents(titulo);
  titulo.style.fontSize = base * titulo.clientWidth / r.getBoundingClientRect().width + 'px';
}
document.fonts.ready.then(ajustarTitulo);
addEventListener('resize', ajustarTitulo);

/* Abas de acesso: uma aberta por vez */
const abas = [...document.querySelectorAll('.aba')];
abas.forEach(aba => aba.addEventListener('click', () => {
  abas.forEach(a => {
    a.classList.toggle('ativa', a === aba);
    a.setAttribute('aria-selected', a === aba);
  });
  /* Servidor Público entra com o usuário; Contribuinte/Fornecedor, com CPF ou e-mail */
  document.querySelector('label[for="login"]').textContent = aba.dataset.label;
  document.getElementById('login').placeholder = aba.dataset.placeholder;
}));

/* Entrar: protótipo sem autenticação, vai direto para a área logada
   levando o tipo de acesso da aba aberta */
document.getElementById('entrar').addEventListener('submit', e => {
  e.preventDefault();
  location.href = 'portal-ass-pendentes.html?acesso=' + document.querySelector('.aba.ativa').dataset.acesso;
});

/* Olho da senha: mostra e esconde */
const senha = document.getElementById('senha');
const olho = document.querySelector('.olho');
olho.addEventListener('click', () => {
  const ver = senha.type === 'password';
  senha.type = ver ? 'text' : 'password';
  olho.innerHTML = `<i class="fas fa-eye${ver ? '-slash' : ''}"></i>`;
  olho.title = ver ? 'Esconder senha' : 'Mostrar senha';
  olho.setAttribute('aria-label', olho.title);
});
</script>

</body>
</html>
