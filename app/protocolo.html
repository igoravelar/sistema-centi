const TAGS = { video: 'VÍDEO', novo: 'NOVO', treino: 'TREINO' };

function itemHTML(it) {
  const tag = it.tag ? `<span class="tag ${it.tag}">${TAGS[it.tag]}</span>` : '';
  const alvo = it.href ? ` onclick="location.href='${it.href}'"` : '';
  return `
    <div class="menu-item" data-busca="${(it.txt + ' ' + it.cod).toLowerCase()}"${alvo}>
      ${tag}
      <span class="menu-item-favorite${it.fav ? ' ativo' : ''}"
            onclick="event.stopPropagation();this.classList.toggle('ativo')">★</span>
      <span class="menu-item-icon">${svg(it.ico)}</span>
      <span class="menu-item-text">${it.txt}</span>
      <span class="menu-item-code">${it.cod}</span>
    </div>`;
}

function menuHTML() {
  const cards = MODULOS_MENU.map(m => `
    <section class="module ${m.classe}">
      <div class="module-header">
        <div class="module-icon">${svg(m.ico)}</div>
        <div class="module-title">${m.titulo}</div>
      </div>
      ${m.itens.map(itemHTML).join('')}
    </section>`).join('');

  const cast = CAST.map(c => `
    <div class="webcast-item">
      <div class="webcast-title">${svg('play')}<span>${c.titulo}</span></div>
      <div class="webcast-details">${c.autor}</div>
    </div>`).join('');

  return `
  <div class="menu">
    <div class="menu-header">
      <div>
        <h1><span class="header-icon">${svg('grade')}</span> Protocolo</h1>
        <div class="search-container">
          <input class="search-input" placeholder="Buscar funcionalidades..." oninput="filtrar(this.value)">
          <span class="search-icon">${svg('lupa')}</span>
        </div>
      </div>
      <div class="centi-cast">
        <div class="centi-cast-badge">${svg('play', 'width="12" height="12"')} Centi Cast</div>
        <div class="webcast-list">${cast}</div>
      </div>
    </div>
    <div class="menu-grid">${cards}</div>
  </div>`;
}

/** Filtra os itens do menu pelo texto ou código da funcionalidade. */
function filtrar(termo) {
  const t = termo.trim().toLowerCase();
  document.querySelectorAll('.module').forEach(mod => {
    let visiveis = 0;
    mod.querySelectorAll('.menu-item').forEach(it => {
      const bate = !t || it.dataset.busca.includes(t);
      it.hidden = !bate;
      if (bate) visiveis++;
    });
    mod.style.display = visiveis ? '' : 'none';
  });
}

const main = montarShell('protocolo');
main.insertAdjacentHTML('beforeend', `<div class="tela" style="padding-left:32px">${menuHTML()}</div>`);
