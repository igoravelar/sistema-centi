<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centi · PO050 - Fluxo de Processos</title>
<link rel="icon" type="image/svg+xml" href="assets/img/ico-favicon-centi-prototipo.svg">
<link rel="stylesheet" href="assets/centi.css?v=16">
<link rel="stylesheet" href="assets/fluxo.css?v=24">
<style>
  /* Pesquisa: filtros à esquerda, Últimas Buscas à direita, separados por
     uma linha vertical cinza */
  .filtros { padding: 14px 16px; display: flex; gap: 16px; }
  /* a divisória vertical atravessa o painel inteiro, de borda a borda */
  .filtros-esq { flex: 1; min-width: 0; border-right: 1px solid var(--tab-bd);
                 margin: -14px 0; padding: 14px 16px 14px 0; }
  .filtros-grid { display: grid; grid-template-columns: 240px 240px 1fr; gap: 10px 12px; }
  .filtros-grid .cab { font-size: 11.5px; font-weight: bold; color: var(--txt); text-align: left; }
  .filtros-grid select, .filtros-grid input {
    height: 32px; border: 1px solid var(--fld-bd); border-radius: 4px;
    padding: 0 10px; color: var(--txt); background: #FFFFFF; outline: none; width: 100%;
  }
  .filtros-grid select:focus, .filtros-grid input:focus { border-color: var(--g); }
  .filtros .remover { border: 0; background: none; color: #E53935; display: grid; place-items: center; }
  .filtros .remover svg { width: 15px; height: 15px; }
  /* linha horizontal: do início do input Campo até a divisória vertical */
  .filtros .divisor { height: 1px; background: var(--tab-bd); margin-top: 14px; }
  /* as quatro ações dos filtros ficam juntas, encostadas na direita */
  .filtros .acoes { display: flex; justify-content: flex-end; align-items: center;
                    gap: 12px; margin-top: 12px; }

  .ultimas {
    flex: 0 0 330px;
    min-width: 0; max-width: 330px; overflow: hidden;
    background: #FFFFFF; border: 1px solid var(--tab-bd); border-radius: 5px; padding: 10px 14px;
  }
  .ultimas h3 { margin: 0 0 8px; font-size: 13px; font-weight: bold; color: var(--txt); display: flex; align-items: center; gap: 8px; }
  .ultimas h3 svg { width: 14px; height: 14px; }
  .ultimas .vazio { font-size: 12px; color: var(--txt-mute); text-align: center; padding: 18px 0 12px; }

  .res-topo { display: flex; align-items: center; gap: 12px; padding: 12px 16px; flex: 0 0 auto; }
  .res-topo h2 { margin: 0; font-size: 18px; font-weight: bold; color: var(--txt); }
  .res-topo .conta { font-size: 13px; color: var(--txt); }
  .res-topo .dir { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .res-topo select { height: 29px; border: 1px solid var(--fld-bd); border-radius: 4px; padding: 0 8px; background: #FFFFFF; color: var(--txt); }
  .res-corpo { flex: 1; min-height: 0; margin: 0 12px 12px; background: #FFFFFF; border: 1px solid var(--tab-bd); border-radius: 4px; overflow: auto; }

  /* ------------------------------- Cadastro -------------------------------
     Coluna de pastas à esquerda (como no PO002); as pastas vão surgindo
     conforme o cadastro avança. */
  .cad-topo .esq { border-right: 1px solid var(--tab-bd); }
  .cad-corpo { flex: 1; min-height: 0; display: flex; }
  /* na linha do cad-corpo o fluxo não pode herdar a largura do desenho
     (min-width auto), senão empurra o botão Nova Etapa para fora da tela */
  .cad-corpo .fluxo { min-width: 0; }

  .arvore { flex: 0 0 240px; overflow: auto; padding: 12px 10px; border-right: 1px solid var(--tab-bd); }
  .arvore .pasta { display: flex; align-items: center; gap: 9px; font-size: 12px; color: #5C5B5B;
                   padding: 7px 4px; border-radius: 4px; cursor: pointer; }
  .arvore .pasta:hover { background: #F1F5E4; }
  .arvore .pasta .chev { flex: 0 0 13px; display: flex; }
  .arvore .pasta .chev svg { width: 13px; height: 13px; color: var(--g); }
  .arvore .pasta .ico { flex: 0 0 15px; display: flex; }
  .arvore .pasta .ico svg { width: 15px; height: 15px; color: var(--g); }
  .arvore .n1 { padding-left: 22px; }
  .arvore .n2 { padding-left: 44px; }
  .arvore .n3 { padding-left: 66px; }
  .arvore .n4 { padding-left: 88px; }
  .arvore .pasta.sel { background: var(--g-soft-bg); color: var(--g-olive); font-weight: bold; }

  /* botão de criar etapa: pílula verde no topo direito do canvas do fluxo */
  .nova-etapa {
    position: absolute; top: 10px; right: 10px; z-index: 5;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px;
    background: var(--btc-bg);
    border: 1px solid var(--btc-bd);
    border-radius: 999px;
    color: var(--btc-txt);
    font-size: 11px; font-weight: bold; text-transform: uppercase;
  }
  .nova-etapa:hover {
    --btc-bg: var(--btc-bg-h); --btc-txt: var(--btc-txt-h);
    --btc-ico: var(--btc-ico-h); --btc-bd: var(--btc-bd-h);
  }
  .nova-etapa svg { width: 12px; height: 12px; color: var(--btc-ico); }

  /* ------------------------- modal Etapa do fluxo -------------------------
     Cobre a área da aba PO050 inteira (pastas + fluxograma), como no PO011. */
  .modal-overlay {
    position: absolute;
    inset: calc(var(--moldura) + var(--tab-h)) var(--moldura) var(--moldura) calc(var(--moldura) + 30px);
    background: rgba(0,0,0,.4);
    border-radius: 5px;
    display: flex; align-items: stretch;
    padding: 20px;
    z-index: 10;
  }
  .modal {
    flex: 1; min-width: 0;
    background: #FFFFFF;
    border-radius: 5px;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .modal-cab { flex: 0 0 52px; display: flex; align-items: center; gap: 10px; padding: 0 18px; }
  .modal-cab h2 { margin: 0; flex: 1; font-size: 16px; font-weight: normal; color: var(--txt-strong); }

  .modal-corpo {
    flex: 1; min-height: 0;
    display: flex;
    margin: 0 14px 14px;
    border: 1px solid var(--tab-bd); border-radius: 5px;
    overflow: hidden;
  }
  .modal-arvore .cab-arv { display: flex; align-items: center; gap: 7px; padding: 6px 4px 10px;
                           font-size: 12.5px; font-weight: bold; color: #5C5B5B; }
  .modal-arvore .cab-arv svg { width: 14px; height: 14px; flex: 0 0 auto; }
  .modal-arvore .cab-arv .mais svg { color: var(--g); }
  .modal-arvore .cab-arv .chev-arv svg { color: var(--g); }

  .modal-dir { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  /* faixa de ações: um cinza acima do cinza do formulário */
  .modal-toolbar { flex: 0 0 49px; display: flex; align-items: center; gap: 10px; padding: 0 14px;
                   background: var(--panel-2); }
  .modal-form { flex: 1; min-height: 0; overflow: auto; padding: 14px 16px;
                background: var(--panel-1); display: flex; flex-direction: column; gap: 10px; }
  .modal-form .campo { max-width: 1100px; }

  /* botão + que aparece ao passar o mouse na linha da pasta */
  .arvore .pasta { position: relative; }
  .arvore .pasta .add {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 22px; height: 22px; padding: 0;
    border: 1px solid var(--btc-bd); border-radius: 50%;
    background: var(--btc-bg); color: var(--btc-txt);
    display: none; place-items: center;
  }
  .arvore .pasta:hover .add { display: grid; }
  .arvore .pasta .add:hover {
    --btc-bg: var(--btc-bg-h); --btc-txt: var(--btc-txt-h);
    --btc-ico: var(--btc-ico-h); --btc-bd: var(--btc-bd-h);
  }
  .arvore .pasta .add svg { width: 12px; height: 12px; color: var(--btc-ico); }

  /* grid de itens da pasta (Documentos / Checklist / Condições) */
  .modal-grid { flex: 1; min-height: 0; overflow: auto; padding: 14px 16px; background: var(--panel-1); }
  .modal-grid .grid-box { background: #FFFFFF; border: 1px solid var(--tab-bd); border-radius: 4px; overflow: auto; }
  .modal-grid .tabela th .funil { float: right; }
  .modal-grid .tabela th svg { width: 11px; height: 11px; color: var(--txt-mute); }
  .modal-grid .tabela .cb { width: 34px; text-align: center; }

  /* ícone + (traço verde) ao lado do título do cadastro */
  .cad-topo .esq .mais-fluxo svg { color: var(--g); }

  /* títulos do topo são links que reabrem o formulário correspondente */
  .nome-link { text-decoration: underline; cursor: pointer; transition: color .15s ease; }
  .nome-link:hover { color: var(--g); }

  /* as cores dos cards por tipo de etapa vêm do fluxo.css (Início azul, Tarefa
     verde, Decisão laranja, Fim vermelho) */

  /* linha que liga os cards do fluxo */
  .liga-cards { width: 2px; height: 56px; background: #BCC8A0; flex: 0 0 auto; }

  /* hover: o card cresce (fluxo.css) e ganha um fundo no tom da sua cor */
  .etapa.inicio:hover    { background: #E7F0FC; }
  .etapa.tarefa:hover    { background: #F5FCD9; }
  .etapa.decisao:hover   { background: #FEF3DF; }
  .etapa.fim:hover       { background: #FDE9E9; }

  /* tooltip do card: shape escuro à direita, com tabelas internas */
  .tooltip-etapa {
    position: absolute;
    left: calc(100% + 15px);
    top: 0;
    width: 210px;
    padding: 8px;
    background: #3F440C;
    border-radius: 10px;
    display: none;
    flex-direction: column;
    gap: 6px;
    z-index: 20;
    pointer-events: none;
    text-align: left;
    cursor: default;
  }
  .etapa:hover .tooltip-etapa { display: flex; }
  .bpmn-wrap.arrastando .etapa:hover .tooltip-etapa { display: none; }

  .tooltip-etapa .tb { border: 1px solid #626A10; border-radius: 7px; overflow: hidden; }
  .tooltip-etapa .tb .cab {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 5px 9px;
    background: #2A2D06;
    color: #FFFFFF; font-size: 10px; font-weight: bold;
  }
  .tooltip-etapa .tb .cab .val { font-weight: normal; }
  .tooltip-etapa .tb .lin {
    padding: 5px 9px;
    background: transparent;
    border-top: 1px solid #626A10;
    color: #EDEEE2; font-size: 10px; font-weight: normal; line-height: 1.4;
  }

  .form { flex: 1; min-width: 0; max-width: 576px; display: flex; flex-direction: column; gap: 10px;
          overflow: auto; padding: 14px 16px; }
  .form .rot .ajuda-rot,
  .modal-form .rot .ajuda-rot { width: 13px; height: 13px; vertical-align: -2px; margin-left: 5px; color: var(--txt-mute); }
</style>
</head>
<body>

<div class="app"></div>

<script src="assets/shell.js?v=13"></script>
<script src="assets/fluxo.js?v=10"></script>
<script>
/* ícones extras desta tela */
Object.assign(ICO, {
  desfazer: '<path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/>',
  checkSimples: '<polyline points="20,6 9,17 4,12"/>',
});

/**
 * Ícones do Font Awesome 5 Free (traçados oficiais, licença CC BY 4.0),
 * mesmos usados na árvore de pastas do PO002.
 */
const FA = {
  pasta: { vb: '0 0 512 512', d: 'M464 128H272l-54.63-54.63c-6-6-14.14-9.37-22.63-9.37H48C21.49 64 0 85.49 0 112v288c0 26.51 21.49 48 48 48h416c26.51 0 48-21.49 48-48V176c0-26.51-21.49-48-48-48zm0 272H48V112h140.12l54.63 54.63c6 6 14.14 9.37 22.63 9.37H464v224z' },
  pastaAberta: { vb: '0 0 576 512', d: 'M572.694 292.093L500.27 416.248A63.997 63.997 0 0 1 444.989 448H45.025c-18.523 0-30.064-20.093-20.731-36.093l72.424-124.155A64 64 0 0 1 152 256h399.964c18.523 0 30.064 20.093 20.73 36.093zM152 224h328v-48c0-26.51-21.49-48-48-48H272l-64-64H48C21.49 64 0 85.49 0 112v278.046l69.077-118.418C86.214 242.25 118.179 224 152 224z' },
  chevronBaixo: { vb: '0 0 512 512', d: 'M504 256c0 137-111 248-248 248S8 393 8 256 119 8 256 8s248 111 248 248zM273 369.9l135.5-135.5c9.4-9.4 9.4-24.6 0-33.9l-17-17c-9.4-9.4-24.6-9.4-33.9 0L256 285.1 154.4 183.5c-9.4-9.4-24.6-9.4-33.9 0l-17 17c-9.4 9.4-9.4 24.6 0 33.9L239 369.9c9.4 9.4 24.6 9.4 34 0z' },
  chevronDireita: { vb: '0 0 512 512', d: 'M256 8c137 0 248 111 248 248S393 504 256 504 8 393 8 256 119 8 256 8zm113.9 231L234.4 103.5c-9.4-9.4-24.6-9.4-33.9 0l-17 17c-9.4 9.4-9.4 24.6 0 33.9L285.1 256 183.5 357.6c-9.4 9.4-9.4 24.6 0 33.9l17 17c9.4 9.4 24.6 9.4 33.9 0L369.9 273c9.4-9.4 9.4-24.6 0-34z' },
  maisCirculo: { vb: '0 0 512 512', d: 'M256 8C119 8 8 119 8 256s111 248 248 248 248-111 248-248S393 8 256 8zm144 276c0 6.6-5.4 12-12 12h-92v92c0 6.6-5.4 12-12 12h-56c-6.6 0-12-5.4-12-12v-92h-92c-6.6 0-12-5.4-12-12v-56c0-6.6 5.4-12 12-12h92v-92c0-6.6 5.4-12 12-12h56c6.6 0 12 5.4 12 12v92h92c6.6 0 12 5.4 12 12v56z' },
  check: { vb: '0 0 512 512', d: 'M256 8C119.033 8 8 119.033 8 256s111.033 248 248 248 248-111.033 248-248S392.967 8 256 8zm0 448c-110.532 0-200-89.451-200-200 0-110.532 89.451-200 200-200 110.532 0 200 89.451 200 200 0 110.532-89.451 200-200 200zm140.204-254.804c4.686 4.686 4.686 12.284 0 16.971l-159.196 159.196c-4.686 4.686-12.284 4.686-16.971 0l-72.708-72.708c-4.686-4.686-4.686-12.284 0-16.971l16.97-16.97c4.686-4.686 12.284-4.686 16.971 0l47.253 47.253 133.741-133.741c4.686-4.686 12.284-4.686 16.971 0l16.969 16.97z' },
};

function fa(nome) {
  const i = FA[nome];
  return `<svg viewBox="${i.vb}" fill="currentColor" aria-hidden="true"><path d="${i.d}"/></svg>`;
}

/* Fluxos cadastrados: [id, título, natureza, status] */
const RESULTADOS = [
  ['1', 'ABERTURA DE LICITAÇÃO 01',  'ABERTURA DE LICITAÇÃO',                 'Publicado'],
  ['3', 'Alvará de Funcionamento',   'Alvará de Funcionamento',               'Rascunho'],
  ['2', 'AQUISIÇÃO MATERIAL',        'AQUISIÇÃO - PD',                        'Publicado'],
  ['9', 'FLUXO TESTE 2',             'TIPO TESTE 2',                          'Rascunho'],
  ['5', 'ISENÇÃO DE IPTU',           'ISENÇÃO DE IPTU',                       'Publicado'],
  ['4', 'Licença para Construção',   'LICENÇA PARA CONSTRUÇÃO',               'Rascunho'],
  ['8', 'PAGAMENTO DE HORAS EXTRAS', 'PAGAMENTO DE HORAS EXTRAS',             'Publicado'],
  ['7', 'TESTE 1 DE FLUXO',          '1º TERMO ADITIVO DE PRAZO DE CONTRATO', 'Rascunho'],
  ['6', 'TESTE MATHEUS',             '1º TERMO ADITIVO',                      'Rascunho'],
];

const COLUNAS = ['ID', 'TÍTULO', 'NATUREZA', 'STATUS'];

/* ------------------------------- Pesquisa ------------------------------- */

/* a grid nasce vazia; o botão Pesquisar traz os resultados */
let pesquisou = false;

function pesquisar() { pesquisou = true; render(); }

function pesquisaHTML() {
  const linhas = !pesquisou ? '' : RESULTADOS.map((r, i) => `
    <tr${i === 0 ? ' class="sel"' : ''} onclick="abrirCadastro(${i})">${r.map(c =>
      `<td>${c}</td>`).join('')}</tr>`).join('');

  return `
  <div class="painel filtros">
    <div class="filtros-esq">
      <div class="filtros-grid">
        <div class="cab">Campo</div><div class="cab">Operação</div><div class="cab">Valor</div>

        <select><option>Nome</option><option>Id</option><option>Natureza</option><option>Status</option></select>
        <select><option>Contendo</option><option>Igual</option><option>Diferente</option></select>
        <input placeholder="">
      </div>

      <div class="divisor"></div>

      <div class="acoes">
        <button class="btn btn-claro">${svg('mais')} Adicionar Filtro</button>
        <button class="btn btn-claro">${svg('borracha')} Limpar Filtros</button>
        <button class="btn btn-primario" onclick="pesquisar()">${svg('lupa')} Pesquisar</button>
        <button class="btn btn-neutro">${svg('salvar')} Salvar Filtros</button>
      </div>
    </div>

    <aside class="ultimas">
      <h3>${svg('relogio')} Últimas Buscas ${svg('ajuda', 'style="width:13px;height:13px;margin-left:auto"')}</h3>
      <div class="vazio">Nenhuma busca recente.</div>
    </aside>
  </div>

  <div class="painel resultado">
    <div class="res-topo">
      <h2>Resultados</h2>
      <span class="conta">${pesquisou ? `Exibindo ${RESULTADOS.length} de ${RESULTADOS.length}` : 'Nenhum resultado encontrado.'}</span>
      <div class="dir">
        <span>Mostrar:</span>
        <select><option>50</option><option>100</option></select>
        <button class="btn btn-claro">${svg('download')} Exportar</button>
      </div>
    </div>
    <div class="res-corpo scroll">
      <table class="tabela">
        <thead><tr>${COLUNAS.map(c => `<th>${c}</th>`).join('')}</tr></thead>
        <tbody>${linhas}</tbody>
      </table>
    </div>
  </div>`;
}

/* ------------------------------- Cadastro ------------------------------- */

/* `id` e os ganchos de evento são opcionais: só os campos que o protótipo
   precisa ler de volta (os da modal da etapa) os informam. */
const atrId = id => (id ? ` id="${id}"` : '');
const atrEv = (ev, fn) => (fn ? ` ${ev}="${fn}"` : '');

/** Campo padrão: rótulo à esquerda, valor à direita (componente do centi.css). */
function campo({ rot, val = '', ro = false, cod, acoes = [], alto = false, ph = '',
                 id, aoDigitar, aoFocar }) {
  const codBox = cod !== undefined
    ? `<input class="cx cod cod-l${ro ? ' ro' : ''}" value="${cod}" ${ro ? 'readonly' : ''}>` : '';
  const acts = acoes.map(a => `<button class="act" title="${a.t}">${svg(a.i)}</button>`).join('');
  return `
    <div class="campo"${alto ? ' style="min-height:46px"' : ''}>
      <div class="rot">${rot}</div>
      <div class="val">
        ${codBox}
        <input${atrId(id)} class="cx${ro ? ' ro' : ''}" value="${val}" placeholder="${ph}"
               ${ro ? 'readonly' : ''}${atrEv('oninput', aoDigitar)}${atrEv('onfocus', aoFocar)}>
        ${acts}
      </div>
    </div>`;
}

/** Variante com textarea (Descrição). */
function campoArea({ rot, val = '', linhas = 4, id, aoDigitar }) {
  return `
    <div class="campo" style="min-height:${linhas * 22 + 16}px">
      <div class="rot">${rot}</div>
      <div class="val"><textarea${atrId(id)} class="cx" rows="${linhas}"${atrEv('oninput', aoDigitar)}>${val}</textarea></div>
    </div>`;
}

/** Variante com select; `val` marca a opção selecionada. */
function campoSelect({ rot, opcoes, ro = false, val, id, aoMudar }) {
  return `
    <div class="campo">
      <div class="rot">${rot}</div>
      <div class="val">
        <select${atrId(id)} class="cx${ro ? ' ro' : ''}" ${ro ? 'disabled' : ''}${atrEv('onchange', aoMudar)}>
          ${opcoes.map(o => `<option${o === val ? ' selected' : ''}>${o}</option>`).join('')}
        </select>
      </div>
    </div>`;
}

/* O Cadastro caminha por etapas: 'fluxo' (dados do fluxo) e, após salvar,
   'versao' (criação da primeira versão). Em cada etapa o formulário nasce
   vazio; o primeiro clique em qualquer campo preenche tudo (protótipo) e
   habilita o Salvar. O Excluir permanece bloqueado — ainda não se pode
   excluir o fluxo neste momento. */
let etapa = 'fluxo';
let preenchido = false;
let fluxoCriado = false;   /* após o primeiro salvar, o título vira link do formulário */

/* -------------------- fluxo pronto: ISENÇÃO DE IPTU --------------------
   Jornada de edição: aberto pela linha da grid da Pesquisa, navega entre o
   formulário do fluxo, a grid de versões e a versão publicada. */
let fluxoSel = null;        /* null = jornada de criação; 'iptu' = fluxo pronto */
let iptuVista = 'fluxo';    /* fluxo | versoes | versao | etapas */
let expandIptu = false;         /* pasta Versões */
let expandIptuVersao = false;   /* filhos do 1 - PUBLICADO */
let expandIptuEtapas = false;   /* lista de etapas dentro de Etapas */

function abrirFluxoIptu() {
  fluxoSel = 'iptu'; iptuVista = 'fluxo';
  expandIptu = false; expandIptuVersao = false; expandIptuEtapas = false;
  irPara('cadastro');
}
function iptuIr(v) {
  iptuVista = v;
  if (v !== 'fluxo') expandIptu = true;
  if (v === 'etapas') { expandIptuVersao = true; expandIptuEtapas = true; cZoom = 0; }
  render();
}
function toggleIptu()        { expandIptu = !expandIptu; render(); }
function toggleIptuVersao()  { expandIptuVersao = !expandIptuVersao; render(); }
function toggleIptuEtapas()  { expandIptuEtapas = !expandIptuEtapas; render(); }
function iptuLinhaVersao()   { iptuIr('versao'); }

/* etapas do fluxo publicado de ISENÇÃO DE IPTU, com posição no canvas */
const IPTU_L = 1350, IPTU_A = 1200;
const ETAPAS_IPTU = [

/* ------------------------- modal Etapa do fluxo ------------------------- */

let modalEtapa = false;
let modalVista = 'form';       /* form | doc-grid | doc-form | check-grid | check-form | cond-grid | cond-form */
let modalPreenchido = false;   /* Título preenchido habilita o Salvar */

/* As etapas criadas alimentam o fluxograma dinamicamente. As duas primeiras
   são as guiadas do protótipo; da terceira em diante o formulário é livre. */
let etapasFluxo = [];
let modalEditIdx = null;   /* índice do card sendo revisto; null = criando */

/* qual formulário a modal usa: etapa1 e etapa2 (guiados) ou 'nova' (livre) */
let modalAlvo = 'etapa1';
let modalCriada = false;   /* etapa já existe: título e formulário preenchidos */

/* O Tipo de etapa comanda a modal: trocar a combo remonta o formulário. O
   rascunho guarda o que já está em tela para nada se perder na remontagem. */
let modalTipo = 'Início';
let modalRascunho = rascunhoVazio();

function rascunhoVazio() {
  return { titulo: '', deptoCod: '', depto: '', crit: '', orient: '', alerta: '',
           aprova: 'Não', prazo: '', tipoprazo: 'Dias corridos', tipofim: 'Deferido' };
}

/* exemplo das duas primeiras etapas da jornada guiada do protótipo */
const EX_ETAPA1 = { titulo: 'Entrada de Protocolo', tipo: 'Início' };
const EX_ETAPA2 = {
  titulo: 'Recebimento do pedido', tipo: 'Tarefa',
  deptoCod: '1960', depto: 'PROTOCOLO CENTRAL',
  crit: 'Pedido recebido, requerimento assinado pelo requerente e documentação anexada.',
  orient: 'Confira se o requerimento está assinado pelo próprio requerente ou por procurador com poderes. Sem a assinatura o pedido não pode ser analisado.',
  alerta: 'O prazo deste processo corre em dias corridos, inclusive fins de semana. Não deixe parado.',
  prazo: '2', tipoprazo: 'Dias corridos',
};

function abrirModalEtapa()  {
  modalEtapa = true; modalVista = 'form'; modalPreenchido = false; modalCriada = false;
  modalEditIdx = null;
  modalAlvo = etapasFluxo.length === 0 ? 'etapa1' : etapasFluxo.length === 1 ? 'etapa2' : 'nova';
  /* etapa nova nasce como Início: é o tipo que abre um fluxo */
  modalTipo = 'Início';
  modalRascunho = rascunhoVazio();
  mExp = { docs: false, doc1: false, ass1: false, doc2: false, check: false, cond: false };
  render();
}

/** Clique num card do fluxograma reabre a modal da etapa, já preenchida. */
function abrirCard(i) {
  modalEtapa = true; modalVista = 'form'; modalPreenchido = true; modalCriada = true;
  modalEditIdx = i;
  modalAlvo = i === 0 ? 'etapa1' : i === 1 ? 'etapa2' : 'nova';
  const e = etapasFluxo[i] || {};
  modalRascunho = i === 0 ? { ...rascunhoVazio(), ...EX_ETAPA1 }
                : i === 1 ? { ...rascunhoVazio(), ...EX_ETAPA2 }
                : { ...rascunhoVazio(), titulo: e.titulo || '',
                    depto: e.depto && e.depto !== '—' ? e.depto : '',
                    prazo: e.dias ? String(parseInt(e.dias, 10)) : '',
                    tipoprazo: /úteis/.test(e.dias || '') ? 'Dias úteis' : 'Dias corridos' };
  modalTipo = e.tipo || 'Início';
  mExp = { docs: false, doc1: false, ass1: false, doc2: false, check: false, cond: false };
  render();
}

/** Habilita o Salvar quando o formulário livre começa a ser preenchido
    (sem re-render, para não perder a digitação). */
function habilitarSalvarEtapa() {
  if (modalPreenchido) return;
  modalPreenchido = true; modalCriada = true;
  const bt = document.querySelector('.bt-salvar');
  if (bt) {
    bt.disabled = false;
    bt.className = 'btn btn-primario bt-salvar';
    bt.setAttribute('onclick', 'salvarModal()');
  }
}

/** Recolhe o que está em tela para o rascunho: só os campos do tipo atual
    existem no DOM, e os demais seguem guardados como estavam. */
function lerRascunhoEtapa() {
  Object.keys(modalRascunho).forEach(k => {
    const el = document.getElementById('ne-' + k);
    if (el) modalRascunho[k] = el.value;
  });
}

/** Troca do Tipo de etapa: remonta o formulário com os campos do novo tipo. */
function mudarTipoEtapa(valor) {
  lerRascunhoEtapa();
  modalTipo = valor;
  modalPreenchido = true; modalCriada = true;
  render();
}

/** Lê o formulário da etapa para montar o card do fluxograma. */
function lerFormEtapa() {
  lerRascunhoEtapa();
  const d = modalRascunho;
  const c = camposDoTipo(modalTipo);
  const prazo = parseInt(d.prazo, 10);
  return {
    titulo: d.titulo || 'Nova etapa',
    tipo: modalTipo,
    /* o Início não tem repartição responsável: qualquer uma abre o processo */
    depto: d.depto || (c.resp ? '—' : 'QUALQUER UM'),
    dias: c.prazo && prazo
      ? `${prazo} ${d.tipoprazo === 'Dias úteis' ? 'dias úteis' : 'dias'}` : null,
  };
}
function fecharModalEtapa() { modalEtapa = false; render(); }

/* voltar ao formulário de uma etapa já criada mantém os dados preenchidos */
function modalIr(vista) {
  modalVista = vista;
  modalPreenchido = vista === 'form' && modalCriada;
  render();
}

/* expansão dos nós da árvore da modal (seta direita = recolhido) */
let mExp = { docs: false, doc1: false, ass1: false, doc2: false, check: false, cond: false };

function mToggle(no) { mExp[no] = !mExp[no]; render(); }

function chevM(no) {
  return `<span class="chev" onclick="event.stopPropagation();mToggle('${no}')">${fa(mExp[no] ? 'chevronBaixo' : 'chevronDireita')}</span>`;
}

/** Abre o formulário de um item já cadastrado (vem preenchido). */
function abrirItemModal(vista) { modalVista = vista; modalPreenchido = true; render(); }

/** Nas duas etapas guiadas, o primeiro toque no Título traz o exemplo — e
    com ele o tipo da etapa, que remonta os campos. No formulário livre nada
    é preenchido: quem digita é o usuário. */
function preencherTituloEtapa() {
  if (modalPreenchido || modalAlvo === 'nova') return;
  const ex = modalAlvo === 'etapa2' ? EX_ETAPA2 : EX_ETAPA1;
  modalRascunho = { ...rascunhoVazio(), ...ex };
  modalTipo = ex.tipo;
  modalPreenchido = true;
  modalCriada = true;
  render();
}

/** Primeiro clique num formulário de item preenche os dados de exemplo. */
function preencherModal() {
  if (modalPreenchido) return;
  modalPreenchido = true;
  render();
}

/** Salvar: no formulário da etapa, fecha a modal e cria (ou atualiza) o card
    no fluxograma; nos formulários de item, leva à grid da pasta. */
function salvarModal() {
  if (!modalPreenchido) return;
  if (modalVista === 'form') {
    const dados = lerFormEtapa();
    if (modalEditIdx === null) etapasFluxo.push(dados);
    else etapasFluxo[modalEditIdx] = dados;
    modalEtapa = false; render();
  }
  else if (modalVista === 'ass-form') modalIr('doc-grid');
  else if (modalVista.endsWith('-form')) modalIr(modalVista.replace('-form', '-grid'));
}

/* ------------------------- canvas: zoom e pan -------------------------
   Mesma mecânica do PO051 (fluxo.js), com estado próprio desta tela: o
   wrap tem overflow oculto (sem barras) e o pan é feito pela rolagem
   programática; o zoom escala o espaçador mantendo o ponto sob o cursor. */

const CANVAS_L = 594;          /* largura do desenho, como no PO051 */
const CARD_A = 112, LIGA_A = 56;

let cZoom = 1, cEscalaCaber = 1;
let cEspacoL = 0, cEspacoA = 0, cDesvioX = 0, cDesvioY = 0;

function alturaDesenho() {
  const n = etapasFluxo.length;
  return Math.max(400, 40 + n * CARD_A + Math.max(0, n - 1) * LIGA_A);
}

function canvasWrap() { return main.querySelector('.cad-corpo .bpmn-wrap'); }

function aplicarZoomC(z, ponto) {
  const wrap = canvasWrap();
  if (!wrap) return;
  const caixa = wrap.querySelector('.bpmn-zoom');
  const espaco = wrap.querySelector('.bpmn-espaco');
  z = Math.min(Math.max(z, cEscalaCaber), 2);

  const r = wrap.getBoundingClientRect();
  const px = ponto ? ponto.x - r.left : wrap.clientWidth / 2;
  const py = ponto ? ponto.y - r.top : wrap.clientHeight / 2;
  const cx = (wrap.scrollLeft + px - cDesvioX) / cZoom;
  const cy = (wrap.scrollTop  + py - cDesvioY) / cZoom;

  cZoom = z;
  const escalaL = cEspacoL * z, escalaA = cEspacoA * z;
  const caixaL = Math.max(escalaL, wrap.clientWidth);
  const caixaA = Math.max(escalaA, wrap.clientHeight);
  cDesvioX = (caixaL - escalaL) / 2;
  cDesvioY = (caixaA - escalaA) / 2;

  caixa.style.width  = Math.round(caixaL) + 'px';
  caixa.style.height = Math.round(caixaA) + 'px';
  espaco.style.transform = `translate(${cDesvioX}px, ${cDesvioY}px) scale(${z})`;

  wrap.scrollLeft = cx * z + cDesvioX - px;
  wrap.scrollTop  = cy * z + cDesvioY - py;
}

function maisZoomC()  { aplicarZoomC(cZoom * 1.25); }
function menosZoomC() { aplicarZoomC(cZoom / 1.25); }

/** Dimensões do desenho conforme o fluxo em edição. */
function dimsCanvas() {
  if (fluxoSel === 'iptu') return { L: IPTU_L, A: IPTU_A };
  return { L: CANVAS_L, A: alturaDesenho() };
}

/** Leva um ponto do desenho para o centro da área visível. */
function centrarPonto(px, py) {
  const wrap = canvasWrap();
  const bpmn = wrap.querySelector('.bpmn');
  wrap.scrollLeft = (bpmn.offsetLeft + px) * cZoom + cDesvioX - wrap.clientWidth / 2;
  wrap.scrollTop  = (bpmn.offsetTop + py) * cZoom + cDesvioY - wrap.clientHeight / 2;
}

/** Remonta a geometria do canvas após cada render e reaplica o zoom.
    No fluxo pronto, enquadra o desenho inteiro; na criação, centraliza o
    último card criado. */
function montarCanvasEtapas() {
  const wrap = canvasWrap();
  if (!wrap) return;
  const espaco = wrap.querySelector('.bpmn-espaco');
  cEspacoL = espaco.offsetWidth;
  cEspacoA = espaco.offsetHeight;
  const { L, A } = dimsCanvas();
  cEscalaCaber = Math.min(1,
    (wrap.clientWidth - 40) / L,
    (wrap.clientHeight - 40) / A);
  const alvo = cZoom;
  cZoom = 1; cDesvioX = 0; cDesvioY = 0;
  aplicarZoomC(alvo);
  if (fluxoSel === 'iptu') {
    centrarPonto(L / 2, A / 2);
  } else {
    const n = etapasFluxo.length;
    const cy = n ? 20 + (n - 1) * (CARD_A + LIGA_A) + CARD_A / 2 : A / 2;
    centrarPonto(L / 2, cy);
  }
}

/** Clique e arraste no canvas: rola o fluxo inteiro (pan), como no PO051.
    Se houve arraste, o clique é engolido para não abrir a modal do card. */
function ativarArrastoCanvas() {
  const wrap = main.querySelector('.cad-corpo .bpmn-wrap');
  if (!wrap || wrap.dataset.arrasto) return;
  wrap.dataset.arrasto = '1';

  let ativo = false, arrastou = false, x0 = 0, y0 = 0, sl = 0, st = 0;

  wrap.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    ativo = true; arrastou = false;
    x0 = e.clientX; y0 = e.clientY;
    sl = wrap.scrollLeft; st = wrap.scrollTop;
  });

  wrap.addEventListener('pointermove', e => {
    if (!ativo) return;
    const dx = e.clientX - x0, dy = e.clientY - y0;
    if (!arrastou) {
      if (Math.hypot(dx, dy) < 5) return;   /* ainda pode virar clique */
      arrastou = true;
      wrap.classList.add('arrastando');
      try { wrap.setPointerCapture(e.pointerId); } catch { /* segue sem captura */ }
    }
    wrap.scrollLeft = sl - dx;
    wrap.scrollTop  = st - dy;
  });

  const encerrar = e => {
    if (!ativo) return;
    ativo = false;
    wrap.classList.remove('arrastando');
    if (wrap.hasPointerCapture && wrap.hasPointerCapture(e.pointerId)) wrap.releasePointerCapture(e.pointerId);
  };
  wrap.addEventListener('pointerup', encerrar);
  wrap.addEventListener('pointercancel', encerrar);

  /* após um arraste, o clique não chega ao card */
  wrap.addEventListener('click', e => {
    if (arrastou) { e.stopPropagation(); e.preventDefault(); }
  }, true);
}

      <span>Versões</span>
      <button class="add" title="Nova versão"
              onclick="event.stopPropagation();novaVersao()">${svg('mais')}</button>
    </div>${filhos}`;
  }

  const addVersao = `
      <button class="add" title="Nova versão"
              onclick="event.stopPropagation();novaVersao()">${svg('mais')}</button>`;

  /* fluxo salvo: pasta Versões selecionada (grid dela no container = ícone
     aberto); recolhida por padrão, expande pelo chevron */
  if (etapa === 'versoes') {
    const filhos = !expandVersoes ? '' : `
    <div class="pasta n1">
      <span class="chev">${fa('chevronDireita')}</span>
      <span class="chev" style="color:#8A8A8A">${svg('checkSimples')}</span>
      <span>10 -</span>
    </div>
    <div class="pasta n1">
      <span class="chev">${fa('chevronDireita')}</span>
      <span class="chev" style="color:#8A8A8A">${svg('checkSimples')}</span>
      <span>11 -</span>
    </div>`;
    return `
    <div class="pasta n0 sel">
      ${chevArv(expandVersoes, 'toggleVersoes')}
      <span class="ico">${fa('pastaAberta')}</span>
      <span>Versões</span>
      ${addVersao}
    </div>${filhos}`;
  }

  /* formulário de nova versão: o container mostra a versão, não a pasta
     Versões — ícone dela fica fechado */
  if (etapa === 'versao') {
    const filho = !expandVersoes ? '' : `
    <div class="pasta n1 sel">
      <span class="chev">${fa('chevronDireita')}</span>
      <span style="font-weight:bold">+</span>
      <span>0 -${preenchido ? ' Versão 1.1/2026' : ''}</span>
    </div>`;
    return `
    <div class="pasta n0">
      ${chevArv(expandVersoes, 'toggleVersoes')}
      <span class="ico">${fa('pasta')}</span>
      <span>Versões</span>
      ${addVersao}
    </div>${filho}`;
  }

  /* etapa === 'etapas': o canvas mostra o conteúdo da pasta Etapas — só ela
     fica com o ícone aberto */
  const filhosVersao = !expandVersao ? '' : `
    <div class="pasta n2 sel">
      <span class="ico">${fa('pastaAberta')}</span>
      <span>Etapas</span>
    </div>
    <div class="pasta n2">
      <span class="ico">${fa('pasta')}</span>
      <span>Variáveis</span>
    </div>
    <div class="pasta n2">
      <span class="ico">${fa('pasta')}</span>
      <span>Paralelismos</span>
    </div>
    <div class="pasta n2">
      <span class="ico">${fa('pasta')}</span>
      <span>Remapeamentos</span>
    </div>`;
  const itemVersao = !expandVersoes ? '' : `
    <div class="pasta n1">
      ${chevArv(expandVersao, 'toggleVersao')}
      <span class="chev" style="color:#8A8A8A">${svg('checkSimples')}</span>
      <span>0 - Versão 1.1/2026</span>
    </div>${filhosVersao}`;
  return `
    <div class="pasta n0">
      ${chevArv(expandVersoes, 'toggleVersoes')}
      <span class="ico">${fa('pasta')}</span>
      <span>Versões</span>
      ${addVersao}
    </div>${itemVersao}`;
}

function cadastroHTML() {
  if (fluxoSel === 'iptu') return cadastroIptuHTML();

  /* depois de salvo, o cabeçalho mostra o título dado ao fluxo, como link
     que reabre o formulário */
  const titulo = !fluxoCriado
    ? `<span class="mais-fluxo" style="display:flex">${svg('mais')}</span>
       <span class="nome nome-link" onclick="verFluxo()">Fluxo do processo</span>`
    : `${svg('checkSimples', 'style="width:17px;height:17px"')}
       <span class="nome nome-link" onclick="verFluxo()"
             title="Substituição de Veículo de Patrimônio Municipal">Substituição de Veículo de Patrimônio Municipal</span>`;

  const btnSalvar = preenchido
    ? `<button class="btn btn-primario" onclick="salvarCadastro()">${svg('salvar')} Salvar${etapa === 'versao' ? '(1)' : ''}</button>`
    : `<button class="btn btn-neutro" disabled>${svg('salvar')} Salvar</button>`;

  /* na etapa 'etapas' o lado direito é o canvas do fluxograma (vazio, no
     desenho do PO051), com o botão de Nova Etapa no topo direito */
  /* cards das etapas criadas, no desenho do PO051, empilhados a partir do
     alto do canvas e ligados por linhas; a cor segue o tipo da etapa e a
     etapa de Início não marca tempo */
  const cards = etapasFluxo.map((e, i) => `
      ${i > 0 ? '<div class="liga-cards"></div>' : ''}
      <div class="etapa ${classeTipo(e.tipo)}" style="position:relative;left:0;top:0;width:190px;height:112px;flex:0 0 auto"
           onclick="abrirCard(${i})">
        <span class="num"></span>
        ${e.dias ? `<span class="dias">${svg('cronometro')}${e.dias}</span>` : ''}
        <span class="nome">${e.titulo}</span>
        <span class="rodape">
          <span class="depto-lbl">DEPTO</span>
          <span class="depto">${e.depto}</span>
        </span>
        <span class="ponto"></span>
        ${tooltipEtapaHTML(e, i)}
      </div>`).join('');

  const card = !etapasFluxo.length ? '' : `
    <div style="position:absolute;left:50%;top:20px;transform:translateX(-50%);
                display:flex;flex-direction:column;align-items:center">
      ${cards}
    </div>`;

  const corpo = etapa === 'etapas'
    ? `<div class="fluxo">
         <div class="bpmn-wrap">
           <div class="bpmn-zoom">
             <div class="bpmn-espaco">
               <div class="bpmn" style="height:${alturaDesenho()}px">${card}</div>
             </div>
           </div>
         </div>
         <div class="zoom-ctrl">
           <button onclick="maisZoomC()" title="Aproximar">${svg('mais_zoom', 'stroke-width="2.6"')}</button>
           <button onclick="menosZoomC()" title="Afastar">${svg('menos_zoom', 'stroke-width="2.6"')}</button>
           <button onclick="alternarTelaCheiaC()" title="Tela cheia">${svg('telaCheia')}</button>
           ${legendaCoresHTML()}
         </div>
         <button class="nova-etapa" onclick="abrirModalEtapa()">${svg('mais')} Nova Etapa</button>
       </div>`
    : etapa === 'versoes'
    ? gridModalHTML(['ID', 'VERSÃO'], [['10', '0'], ['11', '0']], true)
    : `<div class="form scroll"${preenchido ? '' : ' onclick="preencher()"'}>
         ${etapa === 'fluxo' ? camposFluxoHTML() : camposVersaoHTML()}
       </div>`;

  return `
  <div class="cad">
    <div class="cad-topo">
      <div class="esq">
        ${fa('chevronBaixo')}
        ${titulo}
      </div>
      <div class="dir">
        <button class="btn btn-claro" onclick="novoFluxo()">${svg('mais')} Novo</button>
        <button class="btn btn-neutro" disabled>${svg('lixeira')} Excluir</button>
        ${btnSalvar}
        <div style="flex:1"></div>
        <button class="btn btn-claro">${svg('desfazer')} Desfazer</button>
        <button class="btn btn-primario">${svg('gerais')} Operações</button>
      </div>
    </div>

    <div class="cad-corpo">
      <div class="arvore scroll">${arvoreHTML()}</div>
      ${corpo}
    </div>
  </div>`;
}

/* --------------------------------- shell --------------------------------- */

const VTABS = [
  { id: 'pesquisa', rot: 'Pesquisa', ico: 'lupa' },
  { id: 'cadastro', rot: 'Cadastro', ico: 'lapis' },
  { id: 'notas',    rot: 'Notas',    ico: 'notas' },
  { id: 'vicenti',  rot: 'ViCenti',  ico: 'robo' },
];

let vista = 'pesquisa';

function render() {
  const vt = VTABS.map(v => `
    <button class="vtab${v.id === vista ? ' ativa' : ''}" onclick="irPara('${v.id}')">
      ${svg(v.ico)}<span>${v.rot}</span>
    </button>`).join('');

  const corpo = vista === 'pesquisa' ? pesquisaHTML()
              : vista === 'cadastro' ? cadastroHTML()
              : `<div class="painel" style="flex:1;display:grid;place-items:center;color:var(--txt-mute)">
                   ${VTABS.find(v => v.id === vista).rot} — em construção
                 </div>`;

  main.querySelector('.tela')?.remove();
  main.insertAdjacentHTML('beforeend',
    `<div class="tela"><div class="vtabs">${vt}</div><div class="conteudo">${corpo}</div>
     ${modalEtapa && vista === 'cadastro' ? modalEtapaHTML() : ''}</div>`);

  /* o canvas acompanha o fluxo aberto: reaplica zoom e enquadra */
  if (vista === 'cadastro' &&
      ((fluxoSel === 'iptu' && iptuVista === 'etapas') ||
       (fluxoSel !== 'iptu' && etapa === 'etapas'))) {
    ativarArrastoCanvas();
    montarCanvasEtapas();
  }
}

function irPara(id) { vista = id; render(); }

/** Clique numa linha de resultado leva ao Cadastro do fluxo; a linha da
    ISENÇÃO DE IPTU abre o fluxo pronto para edição. */
function abrirCadastro(i) {
  if (RESULTADOS[i] && RESULTADOS[i][0] === '5') { abrirFluxoIptu(); return; }
  fluxoSel = null;
  irPara('cadastro');
}

const main = montarShell('po050');

/* Retomada do ponto em que a aba estava. Como o render() reconstrói a tela
   inteira a partir das variáveis, basta devolvê-las antes de desenhar. O
   estado das modais fica de fora: reabrir uma modal na volta atrapalharia. */
const salvo = lerEstado('po050');
if (salvo) {
  vista = salvo.vista; pesquisou = salvo.pesquisou;
  etapa = salvo.etapa; preenchido = salvo.preenchido; fluxoCriado = salvo.fluxoCriado;
  fluxoSel = salvo.fluxoSel; iptuVista = salvo.iptuVista;
  expandIptu = salvo.expandIptu; expandIptuVersao = salvo.expandIptuVersao;
  expandIptuEtapas = salvo.expandIptuEtapas;
  expandVersoes = salvo.expandVersoes; expandVersao = salvo.expandVersao;
  etapasFluxo = salvo.etapasFluxo; mExp = salvo.mExp;
}

render();

/* estado inicial via ?view=cadastro */
const q = new URLSearchParams(location.search).get('view');
if (q && VTABS.some(v => v.id === q)) irPara(q);

/* o que levar para a próxima visita a esta aba */
guardarEstadoAoSair('po050', () => ({
  vista, pesquisou, etapa, preenchido, fluxoCriado, fluxoSel, iptuVista,
  expandIptu, expandIptuVersao, expandIptuEtapas, expandVersoes, expandVersao,
  etapasFluxo, mExp,
}));
</script>
</body>
</html>
