<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centi · PO051 - Tramitação de Protocolo</title>
<link rel="icon" type="image/svg+xml" href="assets/img/ico-favicon-centi-prototipo.svg">
<link rel="stylesheet" href="assets/centi.css?v=19">
<link rel="stylesheet" href="assets/fluxo.css?v=24">
<link rel="stylesheet" href="assets/chat.css?v=21">
<style>
  /* o fluxo é o conteúdo da aba Cadastro, e o drawer ocupa 2/3 da área.
     O overflow apara o drawer quando ele desliza para fora: a régua de abas
     fica por fora da caixa dele, e sem isso apareceria à direita da tela
     durante a animação de fechar. */
  .cad .fluxo { --drawer-w: 66.667%; overflow: hidden; }
  .vazio-vista { flex: 1; display: grid; place-items: center; color: var(--txt-mute); }
  /* o título abre as informações do protocolo no drawer. É o botão de texto:
     sem caixa, o sublinhado tracejado é o que diz que ele é clicável */
  .cad-topo .esq .link {
    color: #5C5B5C;
    text-decoration: underline dashed;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
    cursor: pointer; transition: color .15s ease;
  }
  .cad-topo .esq .link:hover { color: #A6D100; }

  /* aqui o topo não tem uma segunda coluna para alinhar (como a árvore do
     PO050): o título cresce pelo conteúdo, sem o limite fixo de 240px, sem
     truncamento e sem a divisória vertical que separava as duas colunas */
  .cad-topo .esq { flex: 0 0 auto; overflow: visible; }
  .cad-topo .esq .nome { overflow: visible; text-overflow: clip; }
  /* Novo e Operações andam juntos, encostados na direita */
  .cad-topo .dir { justify-content: flex-end; }

  /* cadastro sem protocolo aberto: instrução em itálico, sem link */
  .cad-topo .esq .nome-vazio {
    font-style: italic;
    font-weight: normal;
    color: #5C5B5B;
    text-decoration: none;
    cursor: default;
  }

  /* linha que liga os cards do fluxo do protocolo: o mesmo verde do contorno do
     card e a mesma leitura de espessura — 3px, porque o zoom do desenho suaviza
     a borda do card e uma linha de 2px acaba parecendo mais fina que ela.
     O verde é o caminho que o processo percorreu; o que ele pulou vem em
     grafite, e o que ainda não percorreu, em grafite tracejado. */
  .liga-prot { width: 3px; height: 56px; background: var(--g); flex: 0 0 auto; }
  .liga-prot.grafite { background: var(--linha-fora); }
  .liga-prot.tracejada {
    background: repeating-linear-gradient(180deg, var(--linha-fora) 0 7px, transparent 7px 14px);
  }

  /* ------------- sinalização das etapas (regra própria do PO051) -------------
     Aqui a cor do card não conta o tipo da etapa — Início, Tarefa, Decisão e
     Fim são todos verdes — e sim o andamento: cinza na concluída, verde cheio
     na etapa da vez e branco nas que ainda não começaram. Basta trocar a
     paleta que o fluxo.css lê nas variáveis do tipo; as regras de lá seguem
     valendo, e as outras telas continuam com as quatro cores. */
  /* cinza claro de tudo que está fora do caminho percorrido: as linhas do que o
     processo pulou e do que ele ainda não percorreu, e o card da etapa pulada */
  .cad .fluxo { --linha-fora: #BDBFB5; }

  .cad .etapa {
    --tipo: var(--g); --tipo-nome: var(--g-mid);
    --tipo-topo: #ADC84A; --tipo-fundo: #8FAA31;
    --tipo-forte: var(--g-stroke); --tipo-claro: #DFF19C;
  }

  /* no drawer da etapa a bolinha e o título seguem a mesma cor do card */
  .cad .drawer-titulo { --tipo: var(--g); --tipo-nome: var(--g-mid); }

  /* paralelismo: os dois cards lado a lado e as bifurcações que abrem e fecham
     o desvio. Cada ramo é metade da bifurcação — meia barra, do meio até o
     centro do seu card, mais a perna que desce (ou sobe) até ele —, e assim
     cada lado leva a cor do seu próprio caminho: verde no ramo que o processo
     percorreu, grafite no que ele pulou. */
  .cad .par { display: flex; flex: 0 0 auto; }
  .cad .bifurca { position: relative; flex: 0 0 auto; height: 28px; }
  /* a quina entre a barra e a perna do ramo é arredondada em 10px: a barra e a
     perna param no raio e o ::after fecha o trecho curvo entre as duas.
     A bifurcação é um traço mais larga que CARD_L + PAR_GAP (ver LINHA_L): a
     perna nasce na borda do ramo, então esse traço a mais é o que faz o eixo
     dela cair no centro da bolinha do card, e não meio traço ao lado. */
  .cad .bifurca .ramo { position: absolute; top: 0; bottom: 0; width: 50%; --linha: var(--g); --raio: 10px; }
  .cad .bifurca .ramo.grafite { --linha: var(--linha-fora); }
  .cad .bifurca .ramo.esq { left: 0; }
  .cad .bifurca .ramo.dir { right: 0; }
  .cad .bifurca .ramo::before { content: ''; position: absolute; height: 3px; background: var(--linha); }
  .cad .bifurca .ramo.esq::before { left: var(--raio); right: 0; }
  .cad .bifurca .ramo.dir::before { left: 0; right: var(--raio); }
  .cad .bifurca.abre .ramo::before  { top: 0; }
  .cad .bifurca.fecha .ramo::before { bottom: 0; }
  .cad .bifurca .ramo i { position: absolute; width: 3px; background: var(--linha); }
  .cad .bifurca.abre .ramo i  { top: var(--raio); bottom: 0; }
  .cad .bifurca.fecha .ramo i { top: 0; bottom: var(--raio); }
  .cad .bifurca .ramo.esq i { left: 0; }
  .cad .bifurca .ramo.dir i { right: 0; }
  .cad .bifurca .ramo::after {
    content: ''; position: absolute;
    width: var(--raio); height: var(--raio); border: 0 solid var(--linha);
  }
  .cad .bifurca.abre .ramo.esq::after {
    top: 0; left: 0; border-top-width: 3px; border-left-width: 3px;
    border-top-left-radius: var(--raio);
  }
  .cad .bifurca.abre .ramo.dir::after {
    top: 0; right: 0; border-top-width: 3px; border-right-width: 3px;
    border-top-right-radius: var(--raio);
  }
  .cad .bifurca.fecha .ramo.esq::after {
    bottom: 0; left: 0; border-bottom-width: 3px; border-left-width: 3px;
    border-bottom-left-radius: var(--raio);
  }
  .cad .bifurca.fecha .ramo.dir::after {
    bottom: 0; right: 0; border-bottom-width: 3px; border-right-width: 3px;
    border-bottom-right-radius: var(--raio);
  }
  .cad .bifurca.tracejada .ramo { --linha: var(--linha-fora); }
  .cad .bifurca.tracejada .ramo::before {
    background: repeating-linear-gradient(90deg, var(--linha) 0 7px, transparent 7px 14px);
  }
  .cad .bifurca.tracejada .ramo i {
    background: repeating-linear-gradient(180deg, var(--linha) 0 7px, transparent 7px 14px);
  }

  /* etapa clicada: nada muda no card além de um contorno extra, na cor e na
     espessura do contorno dele, a 5px de distância */
  .cad .etapa.selecionada { outline: 2px solid var(--tipo); outline-offset: 5px; }

  /* etapa da vez: o card inteiro verde */
  .cad .etapa.executar {
    background: linear-gradient(180deg, var(--tipo-topo) 0%, var(--tipo-fundo) 100%);
    border-color: var(--tipo-forte);
  }
  .cad .etapa.executar .nome,
  .cad .etapa.executar .depto { color: #FFFFFF; }
  .cad .etapa.executar .depto-lbl { color: var(--tipo-claro); }
  .cad .etapa.executar .num { background: var(--tipo-forte); color: #FFFFFF; }

  /* o reenquadre ao abrir/fechar o drawer desliza o fluxo suavemente */
  .cad .bpmn-espaco.anim { transition: transform .28s ease; }

  /* folga extra embaixo do desenho: sem ela a rolagem acaba antes e as
     últimas etapas parariam mais baixas que as demais ao serem abertas —
     com a folga, todo card selecionado para na mesma altura */
  .cad .bpmn-espaco { padding-bottom: 100vh; }

  /* linha separadora entre o título do drawer e o conteúdo */
  .cad .drawer-topo.topo-linha { border-bottom: 1px solid var(--tab-bd); padding-bottom: 16px; }

  /* ------------------- barra de título da etapa -------------------
     Faixa superior do drawer da etapa: número e nome à esquerda, badges de
     situação e de previsão à direita, e o fechar na ponta. O filete cinza
     separa a barra da régua de abas, como no drawer do protocolo — e vai de
     ponta a ponta: as margens negativas anulam o recuo lateral do .drawer-topo,
     e o recuo volta por dentro para o conteúdo não andar. */
  .cad .barra-titulo {
    display: flex; align-items: center; gap: 10px;
    margin: 0 -20px;
    padding: 0 20px 14px;
    border-bottom: 1px solid var(--tab-bd);
  }
  .cad .barra-titulo .drawer-titulo { flex: 1; min-width: 0; }
  .cad .barra-titulo .drawer-titulo h3 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* no lugar da bolinha numerada, a etiqueta ETAPA: — uma caixa branca de
     contorno cinza claro, que só rotula o nome que vem ao lado */
  .cad .barra-titulo .etapa-lbl {
    flex: 0 0 auto;
    padding: 7px 11px;
    background: #FFFFFF;
    border: 1px solid #E4E4E4;
    border-radius: 8px;
    font-size: 10px; font-weight: bold; letter-spacing: .5px;
    color: #BDBDBD;
  }
  /* aqui o fechar entra na linha, no fim da barra, e não solto no canto — e,
     como o do drawer de protocolo, usa a paleta do botão branco, um pouco maior.
     O :hover precisa ser declarado aqui: .bt-fechar:hover tem especificidade
     menor que este seletor, e sozinho não vencia a troca de variável. */
  .cad .barra-titulo .bt-fechar {
    position: static; flex: 0 0 auto;
    width: 24px; height: 24px;
    border-radius: 6px;
    --btc-bg: var(--btb-bg);   --btc-txt: var(--btb-txt);
    --btc-ico: var(--btb-ico);  --btc-bd: var(--btb-bd);
  }
  .cad .barra-titulo .bt-fechar:hover {
    --btc-bg: var(--btb-bg-h);   --btc-txt: var(--btb-txt-h);
    --btc-ico: var(--btb-ico-h); --btc-bd: var(--btb-bd-h);
  }
  .cad .barra-titulo .bt-fechar svg { width: 12px; height: 12px; }

  .cad .badge-etapa {
    flex: 0 0 auto;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 11px;
    background: #FFFFFF;
    border: 1px solid var(--tab-bd);
    border-radius: 999px;
    font-size: 10px; color: var(--txt);
    white-space: nowrap;
  }
  .cad .badge-etapa b { font-weight: bold; color: var(--txt-strong); }


  /* ------------------------------- Pesquisa -------------------------------
     Mesmo desenho da Pesquisa do PO050: filtros à esquerda, Últimas Buscas à
     direita com divisória vertical, e a grid preenchida só após Pesquisar. */
  .pesq { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
  .filtros { padding: 14px 16px; display: flex; gap: 16px; }
  .filtros-esq { flex: 1; min-width: 0; border-right: 1px solid var(--tab-bd);
                 margin: -14px 0; padding: 14px 16px 14px 0; }
  .filtros-grid { display: grid; grid-template-columns: 240px 240px 1fr 30px; gap: 10px 12px; }
  .filtros-grid .cab { font-size: 11.5px; font-weight: bold; color: var(--txt); text-align: left; }
  .filtros-grid select, .filtros-grid input {
    height: 32px; border: 1px solid var(--fld-bd); border-radius: 4px;
    padding: 0 10px; color: var(--txt); background: #FFFFFF; outline: none; width: 100%;
  }
  .filtros-grid select:focus, .filtros-grid input:focus { border-color: var(--g); }
  .filtros .remover { border: 0; background: none; color: #E53935; display: grid; place-items: center; }
  .filtros .remover svg { width: 15px; height: 15px; }
  .filtros .divisor { height: 1px; background: var(--tab-bd); margin-top: 14px; }
  /* as quatro ações dos filtros ficam juntas, encostadas na direita */
  .filtros .acoes { display: flex; justify-content: flex-end; align-items: center;
                    gap: 12px; margin-top: 12px; }

  .ultimas {
    flex: 0 0 330px;
    /* trava o slot em 330px: sem isso o texto comprido das buscas alarga o
       box por cima dos filtros; o excesso vira reticências nos itens */
    min-width: 0; max-width: 330px; overflow: hidden;
    background: #FFFFFF; border: 1px solid var(--tab-bd); border-radius: 5px; padding: 10px 14px;
  }
  .ultimas h3 { margin: 0 0 8px; font-size: 13px; font-weight: bold; color: var(--txt); display: flex; align-items: center; gap: 8px; }
  .ultimas h3 svg { width: 14px; height: 14px; }
  .ultimas ul { margin: 0; padding: 0; }
  .ultimas li { list-style: none; font-size: 12px; padding: 5px 0; color: var(--txt);
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .ultimas li:hover { color: var(--g-dark); }

  .res-topo { display: flex; align-items: center; gap: 12px; padding: 12px 16px; flex: 0 0 auto; }
  .res-topo h2 { margin: 0; font-size: 18px; font-weight: bold; color: var(--txt); }
  .res-topo .conta { font-size: 13px; color: var(--txt); }
  .res-topo .dir { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .res-topo select { height: 29px; border: 1px solid var(--fld-bd); border-radius: 4px; padding: 0 8px; background: #FFFFFF; color: var(--txt); }
  .res-corpo { flex: 1; min-height: 0; margin: 0 12px 12px; background: #FFFFFF; border: 1px solid var(--tab-bd); border-radius: 4px; overflow: auto; }

  /* --------------------- modal do item da etapa ---------------------
     Aberta ao clicar numa linha das grids de Documentos, Checklist ou
     Regras de Saída do drawer: pastas do item à esquerda, formulário à direita.
     Mesmo desenho da modal Etapa do fluxo do PO050. */
  .modal-overlay {
    position: absolute;
    inset: calc(var(--moldura) + var(--tab-h)) var(--moldura) var(--moldura) calc(var(--moldura) + 30px);
    background: rgba(0,0,0,.4);
    border-radius: 5px;
    display: flex; align-items: stretch;
    padding: 20px;
    z-index: 10;
  }
  .modal {
    flex: 1; min-width: 0;
    background: #FFFFFF;
    border-radius: 5px;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .modal-cab { flex: 0 0 52px; display: flex; align-items: center; gap: 10px; padding: 0 18px; }
  .modal-cab h2 { margin: 0; flex: 1; font-size: 16px; font-weight: normal; color: var(--txt-strong); }

  .modal-corpo {
    flex: 1; min-height: 0;
    display: flex;
    margin: 0 14px 14px;
    border: 1px solid var(--tab-bd); border-radius: 5px;
    overflow: hidden;
  }

  .arvore { flex: 0 0 240px; overflow: auto; padding: 12px 10px; border-right: 1px solid var(--tab-bd); }
  .arvore .pasta { position: relative; display: flex; align-items: center; gap: 9px; font-size: 12px;
                   color: #5C5B5B; padding: 7px 4px; border-radius: 4px; cursor: pointer; }
  .arvore .pasta:hover { background: #F1F5E4; }
  .arvore .pasta .chev { flex: 0 0 13px; display: flex; }
  .arvore .pasta .chev svg { width: 13px; height: 13px; color: var(--g); }
  .arvore .pasta .ico { flex: 0 0 15px; display: flex; }
  .arvore .pasta .ico svg { width: 15px; height: 15px; color: var(--g); }
  .arvore .pasta .rot-no { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .arvore .n1 { padding-left: 22px; }
  .arvore .n2 { padding-left: 44px; }
  .arvore .pasta.sel { background: var(--g-soft-bg); color: var(--g-olive); font-weight: bold; }

  /* botão + que aparece ao passar o mouse na linha da pasta */
  .arvore .pasta .add {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 22px; height: 22px; padding: 0;
    border: 1px solid var(--btc-bd); border-radius: 50%;
    background: var(--btc-bg); color: var(--btc-txt);
    display: none; place-items: center;
  }
  .arvore .pasta:hover .add { display: grid; }
  .arvore .pasta .add:hover {
    --btc-bg: var(--btc-bg-h); --btc-txt: var(--btc-txt-h);
    --btc-ico: var(--btc-ico-h); --btc-bd: var(--btc-bd-h);
  }
  .arvore .pasta .add svg { width: 12px; height: 12px; color: var(--btc-ico); }

  /* raiz da árvore: o próprio item da linha clicada */
  .modal-arvore .cab-arv { display: flex; align-items: center; gap: 7px; padding: 6px 4px 10px;
                           font-size: 12.5px; font-weight: bold; color: #5C5B5B; cursor: pointer; }
  .modal-arvore .cab-arv svg { width: 14px; height: 14px; flex: 0 0 auto; color: var(--g); }
  .modal-arvore .cab-arv .nome-item { overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
                                      text-decoration: underline; }
  .modal-arvore .cab-arv:hover .nome-item { color: var(--g-dark); }

  /* pasta ainda sem conteúdo: pastinha cinza, como na tela do sistema */
  .arvore .pasta.vazia .ico svg { color: #9A9A9A; }

  /* raiz da modal de Novo Protocolo: só rótulo, sem link para outra vista */
  .modal-arvore .cab-arv.estatica { cursor: default; }
  .modal-arvore .cab-arv.estatica .nome-item { text-decoration: none; }
  .modal-arvore .cab-arv.estatica:hover .nome-item { color: #5C5B5B; }
  /* protocolo novo (sem id ainda): a marca de inclusão vem no azul do sistema */
  .modal-arvore .cab-arv .marca.novo svg { color: var(--selecao); }

  /* botão só de ícone na faixa de ações da modal */
  .modal-toolbar .btn.so-ico { padding: 0 10px; }
  /* faixa em que as ações andam todas juntas, encostadas na direita */
  .modal-toolbar.direita { justify-content: flex-end; }

  .modal-dir { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  /* faixa de ações: um cinza acima do cinza do formulário */
  .modal-toolbar { flex: 0 0 49px; display: flex; align-items: center; gap: 10px; padding: 0 14px;
                   background: var(--panel-2); }
  .modal-form { flex: 1; min-height: 0; overflow: auto; padding: 14px 16px;
                background: var(--panel-1); display: flex; flex-direction: column; gap: 10px; }
  .modal-form .campo { max-width: 1100px; }

  /* corpo da modal Enviar Remessa: uma coluna de campos e o Processar embaixo */
  .modal-corpo.remessa { flex-direction: column; background: var(--panel-1); }
  .remessa-campos { flex: 1; min-height: 0; overflow: auto; padding: 14px 16px;
                    display: flex; flex-direction: column; gap: 10px; }
  .remessa-campos .campo { max-width: 1100px; }
  .remessa-rodape { flex: 0 0 52px; display: flex; align-items: center; padding: 0 16px 12px; }

  /* grid de itens de uma pasta do item (assinaturas, anotações, ...) */
  .modal-grid { flex: 1; min-height: 0; overflow: auto; padding: 14px 16px; background: var(--panel-1); }
  .modal-grid .grid { background: #FFFFFF; border: 1px solid var(--tab-bd); border-radius: 4px; overflow: hidden; }
</style>
</head>

<div class="app"></div>

<script src="assets/fluxo.js?v=10"></script>
<script>
/* As abas verticais são desta tela: trocam de vista aqui dentro, sem sair do
   PO051. O fluxo fica montado o tempo todo, só oculto, para não perder o
   enquadramento nem o drawer aberto ao ir e voltar. */

/* ------------------------------- Pesquisa ------------------------------- */

/* qual fluxo cada protocolo abre; sem entrada aqui, abre o simples */
const FLUXOS_PROT = { '2292436': FLUXO_PARALELO, '2292410': FLUXO_LICITACAO };

/* etapas do protocolo aberto: definido em abrirFluxoProt, pelo id da linha */
let ETAPAS_PROT = FLUXO_SIMPLES;

const PROT_L = 594;
/* a altura do desenho acompanha as linhas do fluxo aberto — um paralelismo
   ocupa uma linha só, mais as duas bifurcações que o abrem e o fecham */
function alturaProtP() {
  const linhas = linhasFluxoP();
  const pares = linhas.filter(l => l.length > 1).length;
  return 40 + linhas.length * CARD_A + (linhas.length - 1) * LIGA_A + pares * 2 * BIFURCA_A;
}

/** Classe de cor do card conforme o tipo da etapa: Início azul, Tarefa verde,
    Decisão laranja, Fim vermelho (paleta no fluxo.css). */
function classeTipoP(tipo) {
  return tipo === 'Início' ? 'inicio'
       : tipo === 'Tarefa' ? 'tarefa'
       : tipo === 'Decisão' ? 'decisao'
       : 'fim';
}

/* todos os cards do fluxo do protocolo têm a mesma medida; a largura acomoda o
   prazo à esquerda e a situação à direita sem encostar na bolinha do meio */
const CARD_L = 260, CARD_A = 112;

/** Estado do card a partir da situação da etapa:
      concluída (nas duas formas) — fundo cinza, contorno e bolinha da etapa e
                                    título em cinza claro;
      em andamento               — fundo no verde degradê;
      pulada / não aplicável     — fundo branco, tudo em grafite;
      não iniciada               — fundo branco, tudo na cor da etapa. */
function classeEstadoP(n) {
  const sit = situacaoEtapaP(n);
  return sit === 'Concluída' || sit === 'Concluída Retroativa' ? 'finalizada'
       : sit === 'Em Andamento' ? 'executar'
       : sit === 'Pulada' || sit === 'Não Aplicável' ? 'dispensada'
       : 'naoiniciada';
}

/* situações em que o fluxo já resolveu a etapa: o trecho de linha até ela é
   caminho percorrido, e não previsto */
const RESOLVIDAS_P = ['Concluída', 'Concluída Retroativa', 'Pulada', 'Não Aplicável'];

/* das resolvidas, as que o processo não executou: as linhas que levam a elas
   ficam em grafite, porque o protocolo não passou por ali */
const NAO_EXECUTADAS_P = ['Pulada', 'Não Aplicável'];

/* medidas do desenho: altura do traço entre linhas, altura da bifurcação, a
   folga entre os dois cards de um paralelismo e a espessura do traço (a mesma
   do .liga-prot e dos ramos, no CSS lá de cima) */
const LIGA_A = 56, BIFURCA_A = 28, PAR_GAP = 40, LINHA_L = 3;

/** Etapas agrupadas em linhas do desenho: as que compartilham o mesmo `par`
    são paralelas e dividem a mesma linha, uma ao lado da outra. */
function linhasFluxoP() {
  const linhas = [];
  ETAPAS_PROT.forEach(e => {
    const ultima = linhas[linhas.length - 1];
    if (e.par && ultima && ultima[0].par === e.par) ultima.push(e);
    else linhas.push([e]);
  });
  return linhas;
}

/** Card de uma etapa no desenho. */
function cardEtapaP(e) {
  return `
    <div class="etapa ${classeTipoP(e.tipo)} ${classeEstadoP(e.n)}" data-n="${e.n}"
         style="position:relative;left:0;top:0;width:${CARD_L}px;height:${CARD_A}px;flex:0 0 auto"
         onclick="abrirEtapaProt(${e.n})">
      <span class="num"></span>
      <span class="nome">${e.titulo}</span>
      <span class="rodape">
        <span class="depto-lbl">DEPTO</span>
        <span class="depto">${e.depto}</span>
      </span>
      <span class="ponto"></span>
    </div>`;
}

/** Abre o fluxo do protocolo `i`. `aoMontar` troca o que acontece depois do
    desenho pronto — a retomada de estado usa isso para reabrir o drawer do
    protocolo, ou nenhum.

    Sem `aoMontar`, o padrão é o caminho de quem chega da Pesquisa: o fluxo abre
    já na etapa vigente, com a régua nas informações, porque o que se vai fazer
    ali é tramitar o protocolo na etapa em que ele está — e não reler os dados
    do protocolo, que continuam a um clique no título. */
function abrirFluxoProt(i, aoMontar) {
  protAberto = i; etapaSelP = null;
  ETAPAS_PROT = FLUXOS_PROT[RESULTADOS_P[i][0]] || FLUXO_SIMPLES;
  irPara('cadastro');      /* mostra o .cad antes de medir o canvas */
  montarFluxoProt();
  (aoMontar || (() => { abaLatP = 'info'; abrirEtapaProt(etapaVigenteP()); }))();
}

function montarFluxoProt() {
  const r = RESULTADOS_P[protAberto];
  main.querySelector('.cad-topo .esq').innerHTML = tituloCadEsqHTML();

  /* o traço que chega numa linha sai da anterior. Verde é o caminho que o
     processo percorreu; grafite tracejado, o que ele ainda não percorreu; e
     grafite cheio, o que ele pulou — o trecho de uma etapa não executada. */
  const previsto = linha => !linha.every(e => RESOLVIDAS_P.includes(e.situacao));
  const puladas = linha => linha.every(e => NAO_EXECUTADAS_P.includes(e.situacao));
  const liga = (tracejada, grafite) =>
    `<div class="liga-prot${tracejada ? ' tracejada' : grafite ? ' grafite' : ''}"></div>`;
  /* na bifurcação cada ramo leva a cor do seu próprio card */
  const bifurca = (lado, tracejada, ramos) => `
    <div class="bifurca ${lado}${tracejada ? ' tracejada' : ''}" style="width:${CARD_L + PAR_GAP + LINHA_L}px">
      ${['esq', 'dir'].map((l, k) => `
      <span class="ramo ${l}${NAO_EXECUTADAS_P.includes(ramos[k].situacao) ? ' grafite' : ''}"><i></i></span>`).join('')}
    </div>`;

  const linhas = linhasFluxoP();
  const cards = linhas.map((atual, i) => {
    const antes = i > 0 ? linhas[i - 1] : null;
    /* o traço vertical só é grafite quando o processo não passou por nenhum dos
       lados: num paralelismo, basta um ramo ter corrido para o tronco ser verde */
    const chegando = antes ? liga(previsto(antes), puladas(antes) || puladas(atual)) : '';
    if (atual.length === 1) return chegando + cardEtapaP(atual[0]);
    /* paralelismo: a bifurcação abre para os dois cards e fecha depois deles */
    return `
    ${chegando}
    ${bifurca('abre', antes ? previsto(antes) : false, atual)}
    <div class="par" style="gap:${PAR_GAP}px">${atual.map(cardEtapaP).join('')}</div>
    ${bifurca('fecha', previsto(atual), atual)}`;
  }).join('');

  main.querySelector('.cad .fluxo').innerHTML = `
    <div class="bpmn-wrap">
      <div class="bpmn-zoom">
        <div class="bpmn-espaco">
          <div class="bpmn" style="height:${alturaProtP()}px">
            <div style="position:absolute;left:50%;top:20px;transform:translateX(-50%);
                        display:flex;flex-direction:column;align-items:center">${cards}</div>
          </div>
        </div>
      </div>
    </div>
    <div class="zoom-ctrl">
      <button onclick="maisZoomP()" title="Aproximar">${svg('mais_zoom', 'stroke-width="2.6"')}</button>
      <button onclick="menosZoomP()" title="Afastar">${svg('menos_zoom', 'stroke-width="2.6"')}</button>
      <button onclick="centralizarFluxoP()" title="Centralizar fluxograma">${svg('centralizar')}</button>
      <button onclick="telaCheiaP()" title="Tela cheia">${svg('telaCheia')}</button>
      ${legendaCoresHTML(true)}
    </div>
    <aside class="drawer"></aside>`;

  ativarArrastoProt();
  montarCanvasP();
}

/* Situação da etapa (vem de ETAPAS_PROT): alimenta o farol no card, o farol da
   barra de título do drawer e o campo Status da aba Dados. As cores dos faróis
   estão no fluxo.css. */
const SITUACOES_P = ['Não Iniciada', 'Em Andamento', 'Pulada', 'Não Aplicável',
                     'Concluída', 'Concluída Retroativa'];
const CLASSE_SITUACAO = { 'Não Iniciada': 'naoiniciada', 'Em Andamento': 'andamento',
                          'Pulada': 'pulada', 'Não Aplicável': 'naoaplicavel',
                          'Concluída': 'concluida', 'Concluída Retroativa': 'retroativa' };

function situacaoEtapaP(n) {
  const e = ETAPAS_PROT[n - 1];
  return (e && e.situacao) || 'Não Iniciada';
}

/** A etapa em que o protocolo está agora — a que o usuário precisa tramitar.
    É a primeira Em Andamento; num paralelismo com duas correndo juntas, a de
    cima. Se nenhuma está em andamento, cai na primeira que o fluxo ainda não
    resolveu (a próxima da fila) e, com tudo resolvido, no Fim. */
function etapaVigenteP() {
  const emAndamento = ETAPAS_PROT.findIndex(e => e.situacao === 'Em Andamento');
  if (emAndamento !== -1) return emAndamento + 1;
  const pendente = ETAPAS_PROT.findIndex(e => !RESOLVIDAS_P.includes(e.situacao));
  return (pendente !== -1 ? pendente : ETAPAS_PROT.length - 1) + 1;
}

const PREVISAO_ETAPA = '01/10/2026';

/** Botões de navegação do rodapé: a primeira etapa não tem anterior e a de
    Fim não tem próxima — nesses casos o botão fica apagado, sem clique.
    O ícone vem sempre antes do texto, como em todos os botões do protótipo. */
function btEtapa(lado, n) {
  const anterior = lado === 'anterior';
  const rot = anterior ? 'Etapa Anterior' : 'Próxima Etapa';
  const ico = anterior ? svg('voltar') : svg('seta');
  const ativo = anterior ? n > 1 : n < ETAPAS_PROT.length;
  if (!ativo) return `<button class="btn btn-neutro" disabled>${ico} ${rot}</button>`;
  return `<button class="btn btn-branco" onclick="abrirEtapaProt(${
    anterior ? n - 1 : n + 1})">${ico} ${rot}</button>`;
}

/**

 * termina de entrar (1ª abertura) ou de trocar de conteúdo (já aberto) —
 * é aí que decidimos se o canvas reenquadra o fluxo inteiro ou só centraliza
 * o card clicado, mantendo o zoom atual.
 */
function mostrarDrawer(html, aoAnimar, comRail = false) {
  const d = drawerP();
  /* só o drawer da etapa tem a régua de abas: nela o branco sai do .drawer e
     passa para o painel de dentro */
  d.classList.toggle('com-rail', comRail);
  if (d.classList.contains('aberto')) {
    d.classList.add('trocando');
    setTimeout(() => { d.innerHTML = html; d.classList.remove('trocando'); aoAnimar(); }, 150);
  } else {
    d.innerHTML = html;
    d.classList.add('aberto');
    aoDrawerAssentar(d, aoAnimar);
  }
}

/** Roda `fn` uma única vez, quando o drawer terminar de tomar (ou devolver) a
    largura. O drawer transiciona transform, margin-right e opacity: só o fim
    de `margin-right` garante que a área do fluxo já tem a largura final —
    escutar qualquer transitionend mediria o canvas no meio do caminho. */
function aoDrawerAssentar(d, fn) {
  let feito = false;
  const rodar = () => { if (feito) return; feito = true; d.removeEventListener('transitionend', naTransicao); fn(); };
  const naTransicao = e => { if (e.target === d && e.propertyName === 'margin-right') rodar(); };
  d.addEventListener('transitionend', naTransicao);
  setTimeout(rodar, 340);   /* rede de segurança se a transição não ocorrer */
}

  etapaSelP = null;

/** Clique num card: mantém o zoom atual e só centraliza aquele card próximo
    do topo do espaço livre ao lado do drawer — é essa animação (sem reenquadrar
    o fluxo inteiro) que dá a sensação de destaque no card clicado. */
function abrirEtapaProt(n) {
  etapaSelP = n; abaP = 'Dados';

     contando o andamento da etapa */
  main.querySelectorAll('.cad .etapa').forEach(el => {

/* --------------------- canvas: zoom e pan (como no PO050) --------------------- */

let pZoom = 1, pEscalaCaber = 1;
let pEspacoL = 0, pEspacoA = 0, pDesvioX = 0, pDesvioY = 0;

function wrapP() { return main.querySelector('.cad .bpmn-wrap'); }

/**
 * Largura útil do canvas. Não usa `wrap.clientWidth` porque o drawer leva
 * 280ms para tomar/devolver a sua faixa: durante a animação o clientWidth
 * ainda é o antigo, e enquadrar por ele joga o fluxo para fora da vista.
 * Aqui a conta é feita pelo destino: largura do fluxo menos a do drawer
 * quando ele está aberto.
 */
function larguraCanvasP() {
  const fluxo = main.querySelector('.cad .fluxo');
  const d = drawerP();
  if (!fluxo) return 0;
  const total = fluxo.clientWidth;
  const aberto = d && d.classList.contains('aberto');
  return aberto ? total - d.offsetWidth : total;
}

function aplicarZoomP(z, ponto) {
  const wrap = wrapP();
  if (!wrap) return;
  const caixa = wrap.querySelector('.bpmn-zoom');
  const espaco = wrap.querySelector('.bpmn-espaco');
  if (!caixa || !espaco) return;   /* canvas vazio: nada para escalar */
  z = Math.min(Math.max(z, pEscalaCaber), 2);

  const rc = wrap.getBoundingClientRect();
  const largura = larguraCanvasP();
  const px = ponto ? ponto.x - rc.left : largura / 2;
  const py = ponto ? ponto.y - rc.top : wrap.clientHeight / 2;
  const cx = (wrap.scrollLeft + px - pDesvioX) / pZoom;
  const cy = (wrap.scrollTop  + py - pDesvioY) / pZoom;

  pZoom = z;
  const escalaL = pEspacoL * z, escalaA = pEspacoA * z;
  const caixaL = Math.max(escalaL, largura);
  const caixaA = Math.max(escalaA, wrap.clientHeight);
  pDesvioX = (caixaL - escalaL) / 2;
  pDesvioY = (caixaA - escalaA) / 2;

  caixa.style.width  = Math.round(caixaL) + 'px';
  caixa.style.height = Math.round(caixaA) + 'px';
  espaco.style.transform = `translate(${pDesvioX}px, ${pDesvioY}px) scale(${z})`;

  wrap.scrollLeft = cx * z + pDesvioX - px;
  wrap.scrollTop  = cy * z + pDesvioY - py;
}

function maisZoomP()  { aplicarZoomP(pZoom * 1.25); }
function menosZoomP() { aplicarZoomP(pZoom / 1.25); }

/** Desliza a rolagem do canvas até o alvo, com desaceleração (easeOut cúbico:
    começa rápido e "estaciona" devagar antes de parar). Um clique novo antes
    da animação anterior terminar precisa cancelá-la — senão as duas ficam
    disputando o scroll a cada frame e o resultado final fica errado. */
let deslizarToken = 0;

function deslizarScroll(wrap, sl, st) {
  const meu = ++deslizarToken;
  const sl0 = wrap.scrollLeft, st0 = wrap.scrollTop;
  const t0 = performance.now(), dur = 280;
  function passo(t) {
    if (meu !== deslizarToken) return;   /* uma animação mais nova assumiu */
    const p = Math.min((t - t0) / dur, 1);
    const e = 1 - Math.pow(1 - p, 3);
    wrap.scrollLeft = sl0 + (sl - sl0) * e;
    wrap.scrollTop  = st0 + (st - st0) * e;
    if (p < 1) requestAnimationFrame(passo);
  }
  requestAnimationFrame(passo);
}

/* etapa selecionada: sempre no mesmo tamanho (zoom fixo, 1:1) e sempre na
   mesma posição — centralizado na horizontal, com o topo do card alinhado
   logo abaixo da régua de abas do drawer (Dados/Documentos/...) */
const ZOOM_ETAPA = 1;
const GAP_ETAPA_TOPO = 26;

/** Fixa o zoom da etapa e desliza (easeOut, via deslizarScroll) até o card
    clicado ocupar sempre o mesmo tamanho e a mesma posição, não importa o
    zoom em que o fluxo estava nem o tamanho do card no desenho. */
function centralizarEtapaP(n) {
  const wrap = wrapP();
  if (!wrap) return;
  const bpmn = wrap.querySelector('.bpmn');
  const coluna = bpmn && bpmn.firstElementChild;   /* wrapper absoluto que empilha os cards */
  const card = wrap.querySelector(`.etapa[data-n="${n}"]`);
  const topoDrawer = drawerP().querySelector('.drawer-topo');
  if (!bpmn || !coluna || !card) return;

  const slAntes = wrap.scrollLeft, stAntes = wrap.scrollTop;

  const espaco = wrap.querySelector('.bpmn-espaco');
  espaco.classList.add('anim');
  setTimeout(() => espaco.classList.remove('anim'), 320);

  aplicarZoomP(ZOOM_ETAPA);   /* recalcula pDesvioX/Y para o zoom fixo */

  const alturaTopo = topoDrawer ? topoDrawer.getBoundingClientRect().height : 0;
  /* a coluna de cards fica em left:50% com translateX(-50%): offsetLeft ignora
     o transform, então metade da largura dela entra na conta à mão — sem isso
     o card estaciona meia coluna à esquerda e encosta na borda do canvas */
  const xColuna = coluna.offsetLeft - coluna.offsetWidth / 2;
  const x     = (bpmn.offsetLeft + xColuna + card.offsetLeft + card.offsetWidth / 2) * pZoom + pDesvioX;
  const yTopo = (bpmn.offsetTop  + coluna.offsetTop  + card.offsetTop) * pZoom + pDesvioY;

  const alvoSL = x - larguraCanvasP() / 2;
  const alvoST = yTopo - alturaTopo - GAP_ETAPA_TOPO;

  /* aplicarZoomP já reposicionou o scroll (para ancorar o zoom no centro);
     desfaz esse salto e anima do ponto onde o usuário estava até o alvo */
  wrap.scrollLeft = slAntes; wrap.scrollTop = stAntes;
  deslizarScroll(wrap, alvoSL, alvoST);
}

function montarCanvasP(animar) {
  const wrap = wrapP();
  if (!wrap || protAberto === null) return;
  /* transitionend e o fallback de 320ms podem chegar juntos: um só vale */
  if (animar) {
    if (montarCanvasP.ultimo && performance.now() - montarCanvasP.ultimo < 200) return;
    montarCanvasP.ultimo = performance.now();
  }
  const espaco = wrap.querySelector('.bpmn-espaco');
  if (!espaco) return;   /* canvas ainda vazio (nenhum protocolo montado) */
  const slAntes = wrap.scrollLeft, stAntes = wrap.scrollTop;

  if (animar) {
    espaco.classList.add('anim');
    setTimeout(() => espaco.classList.remove('anim'), 320);
  }

  pEspacoL = espaco.offsetWidth;
  pEspacoA = espaco.offsetHeight;
  pEscalaCaber = Math.min(1,
    (larguraCanvasP() - 40) / PROT_L,
    (wrap.clientHeight - 40) / alturaProtP());
  pZoom = 1; pDesvioX = 0; pDesvioY = 0;
  aplicarZoomP(pEscalaCaber);   /* enquadra o fluxo inteiro */

  const bpmn = wrap.querySelector('.bpmn');
  const alvoSL = (bpmn.offsetLeft + PROT_L / 2) * pZoom + pDesvioX - larguraCanvasP() / 2;
  const alvoST = (bpmn.offsetTop + alturaProtP() / 2) * pZoom + pDesvioY - wrap.clientHeight / 2;

  if (animar) {
    wrap.scrollLeft = slAntes; wrap.scrollTop = stAntes;
    deslizarScroll(wrap, alvoSL, alvoST);
  } else {
    wrap.scrollLeft = alvoSL; wrap.scrollTop = alvoST;
  }
}

/** Botão de centralizar: reenquadra o fluxograma inteiro na área visível. Com o
    drawer aberto, a conta é feita sobre a janela que sobra para o desenho —
    larguraCanvasP desconta o drawer. */
function centralizarFluxoP() { montarCanvasP(true); }

function telaCheiaP() {
  const fluxoEl = main.querySelector('.cad .fluxo');
  if (document.fullscreenElement) document.exitFullscreen();
  else if (fluxoEl && fluxoEl.requestFullscreen) fluxoEl.requestFullscreen();
}

document.addEventListener('fullscreenchange', () => {
  if (protAberto !== null) montarCanvasP();
});

function ativarArrastoProt() {
  const wrap = wrapP();
  if (!wrap || wrap.dataset.arrasto) return;
  wrap.dataset.arrasto = '1';

  let ativo = false, arrastou = false, x0 = 0, y0 = 0, sl = 0, st = 0;

  wrap.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    ativo = true; arrastou = false;
    x0 = e.clientX; y0 = e.clientY;
    sl = wrap.scrollLeft; st = wrap.scrollTop;
  });

  wrap.addEventListener('pointermove', e => {
    if (!ativo) return;
    const dx = e.clientX - x0, dy = e.clientY - y0;
    if (!arrastou) {
      if (Math.hypot(dx, dy) < 5) return;
      arrastou = true;
      wrap.classList.add('arrastando');
      try { wrap.setPointerCapture(e.pointerId); } catch { /* segue sem captura */ }
    }
    wrap.scrollLeft = sl - dx;
    wrap.scrollTop  = st - dy;
  });

  const encerrar = e => {
    if (!ativo) return;
    ativo = false;
    wrap.classList.remove('arrastando');
    if (wrap.hasPointerCapture && wrap.hasPointerCapture(e.pointerId)) wrap.releasePointerCapture(e.pointerId);
  };
  wrap.addEventListener('pointerup', encerrar);
  wrap.addEventListener('pointercancel', encerrar);

  wrap.addEventListener('click', e => {
    if (arrastou) { e.stopPropagation(); e.preventDefault(); }
  }, true);
}

/* --------------------------------- vistas --------------------------------- */

function irPara(id) {
  vista = id;
  main.querySelectorAll('.vtab').forEach((b, i) => b.classList.toggle('ativa', VISTAS[i].id === id));
  main.querySelector('.cad').hidden = id !== 'cadastro';
  main.querySelector('.pesq').hidden = id !== 'pesquisa';

  const outra = main.querySelector('.vazio-vista');
  outra.hidden = id === 'cadastro' || id === 'pesquisa';
  outra.textContent = (VISTAS.find(v => v.id === id) || {}).rot + ' — em construção';

  if (id === 'cadastro' && protAberto !== null) montarCanvasP();
}

const main = montarShell('po051');

/* O que a tela era quando saímos para outra aba. As duas primeiras entram
   antes da montagem, para a grid já nascer pesquisada e com a linha marcada;
   o resto é reaplicado depois, quando o DOM existe. */
const ESTADO_P = lerEstado('po051') || {};
if (ESTADO_P.pesquisou) pesquisou = true;
if (ESTADO_P.protSel !== undefined && ESTADO_P.protSel !== null) protSel = ESTADO_P.protSel;

main.insertAdjacentHTML('beforeend', `
  <div class="tela">
    <div class="vtabs">
      ${VISTAS.map(v => `
        <button class="vtab${v.id === vista ? ' ativa' : ''}" onclick="irPara('${v.id}')">
          ${svg(v.ico)}<span>${v.rot}</span>
        </button>`).join('')}
    </div>

    <div class="conteudo">
      <div class="pesq">${pesquisaHTML()}</div>

      <div class="cad" hidden>
        <div class="cad-topo">
          <div class="esq">${tituloCadEsqHTML()}</div>
          <div class="dir">
            <button class="btn btn-claro" onclick="abrirNovoProtP()">${svg('mais')} Novo</button>
            <button class="btn btn-primario">${svg('gerais')} Operações</button>
          </div>
        </div>

        <div class="fluxo">${canvasVazioHTML()}</div>
      </div>

      <div class="painel vazio-vista" hidden></div>
    </div>
  </div>`);

/* Retomada: reabre o fluxo e o drawer que estavam abertos. Vem antes do
   ?view porque o parâmetro é um pedido explícito de outra tela e deve vencer. */
if (ESTADO_P.protAberto !== undefined && ESTADO_P.protAberto !== null) {
  const n = ESTADO_P.etapaSelP;
  abrirFluxoProt(ESTADO_P.protAberto,
    ESTADO_P.drawer === 'etapa' && n !== null && n !== undefined
      ? () => {
          if (ESTADO_P.abaLatP) abaLatP = ESTADO_P.abaLatP;
          abrirEtapaProt(n);
          if (abaLatP === 'info' && ESTADO_P.abaP) trocarAbaP(ESTADO_P.abaP);
        }
      : ESTADO_P.drawer === 'protocolo' ? abrirProtocoloP : () => {});
} else if (ESTADO_P.vista) {
  irPara(ESTADO_P.vista);
}

/* estado inicial via ?view=cadastro (abre com a instrução, sem fluxo) */
const q = new URLSearchParams(location.search);
if (q.get('view') && VISTAS.some(v => v.id === q.get('view'))) irPara(q.get('view'));

/* o que levar para a próxima visita a esta aba */
guardarEstadoAoSair('po051', () => {
  const d = main.querySelector('.cad .drawer');
  const aberto = d && d.classList.contains('aberto');
  return {
    vista, pesquisou, protSel, protAberto, etapaSelP, abaP, abaLatP,
    drawer: !aberto ? null : etapaSelP !== null ? 'etapa' : 'protocolo',
  };
});
</script>
</body>
</html>
