<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centi · PO011 - Central de Protocolos</title>
<link rel="stylesheet" href="assets/centi.css">
<style>
  /* fundo: a tela do PO002 esmaecida sob o modal */
  .fundo { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
  .fundo .painel.filtros   { height: 164px; }

  /* ------------------------------- modal ------------------------------- */
  /* o inset é medido a partir do padding box do .main, por isso soma a moldura */
  .modal-overlay {
    position: absolute;
    inset: calc(var(--moldura) + var(--tab-h)) var(--moldura) var(--moldura) calc(var(--moldura) + 30px);
    background: rgba(0,0,0,.4);
    border-radius: 5px;
    display: flex; align-items: stretch;
    padding: 20px;
    z-index: 10;
  }
  .modal {
    flex: 1; min-width: 0;
    background: var(--modal-bg);
    border-radius: 5px;
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  .modal-topo {
    flex: 0 0 41px;
    display: flex; align-items: center; gap: 10px;
    padding: 0 10px;
    background: #FFFFFF;
    border-bottom: 1px solid var(--g-soft-bd2);
    border-radius: 5px 5px 0 0;
  }
  .modal-topo .chip {
    height: 21px; padding: 0 8px;
    border: 1px solid var(--tab-bd); border-radius: 4px;
    background: #FFFFFF;
    font-size: 11px; font-weight: bold; color: var(--txt);
    display: grid; place-items: center;
  }
  .modal-topo h2 { margin: 0 0 0 6px; font-size: 13px; font-weight: bold; color: var(--txt); }
  .bt-fechar {
    width: 20px; height: 20px;
    border: 1px solid var(--g-soft-bd2); border-radius: 4px;
    background: var(--g-soft-bg); color: var(--g-olive);
    display: grid; place-items: center; padding: 0;
  }
  .bt-fechar:hover { background: var(--g); color: #FFFFFF; border-color: var(--g); }
  .bt-fechar svg { width: 11px; height: 11px; }

  /* sem moldura: o fluxo e o drawer encostam nas bordas do modal */
  .modal-corpo { flex: 1; min-height: 0; display: flex; }

  /* grade de pontos do protótipo: passo 17,3 x 15,9 px em #E2EACF.
     Sem barras de rolagem: a navegação é por clique e arraste (ver ativarArrasto). */
  .bpmn-wrap {
    position: relative;
    flex: 1; min-width: 0;
    overflow: hidden;
    padding: 20px;
    background-image: radial-gradient(#E2EACF 1.45px, transparent 1.45px);
    background-size: 17.3px 15.9px;
    cursor: grab;
    user-select: none;
    touch-action: none;
  }
  /* enquanto arrasta, a mão fechada vale em toda a área, inclusive sobre os cards */
  .bpmn-wrap.arrastando,
  .bpmn-wrap.arrastando .etapa { cursor: grabbing; }
  .bpmn-wrap.arrastando .etapa:hover { transform: none; box-shadow: none; }
  .bpmn { position: relative; width: 594px; height: 1260px; margin: 0 auto; }
  /* as linhas nunca interceptam o ponteiro: o clique é sempre do card ou do arraste */
  .bpmn svg.conectores { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  /* -------------------------------- etapa -------------------------------- */
  /* o título ocupa toda a faixa entre o topo do card (onde fica a bolinha) e a
     régua do DEPTO, e se centraliza nela — daí as distâncias iguais dos dois lados */
  .etapa {
    position: absolute;
    border-radius: 10px;
    display: flex; flex-direction: column;
    cursor: pointer;
    z-index: 2;
    transform-origin: center;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .etapa .dias {
    position: absolute; top: 7px; left: 10px;
    display: flex; align-items: center; gap: 5px;
    font-size: 9px;
  }
  .etapa .dias svg { width: 11px; height: 11px; }

  /* o padding-top desconta os 14px em que a bolinha invade o card, para que a
     faixa de centralização comece na base dela e não na borda */
  .etapa .nome {
    flex: 1;
    display: grid; place-items: center;
    padding: 14px 12px 0;
    font-size: 14px; font-weight: bold; text-align: center; line-height: 16px;
  }

  .etapa .rodape { flex: 0 0 auto; padding-bottom: 9px; text-align: center; }
  /* sem recuo lateral: as réguas encostam nas bordas do card */
  .etapa .depto-lbl {
    font-size: 7px;
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 4px;
  }
  .etapa .depto-lbl::before, .etapa .depto-lbl::after { content: ""; flex: 1; height: 1px; background: currentColor; opacity: .45; }
  .etapa .depto { font-size: 11px; padding: 0 8px; }
  .etapa .num {
    position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
    width: 29px; height: 29px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 13px; font-weight: bold;
  }
  .etapa .ponto {
    position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%);
    width: 7px; height: 7px; border-radius: 50%;
  }

  /* verde claro — etapa concluída */
  .etapa.concluida { background: var(--g-soft-bg); border: 1px solid #CAD69C; }
  .etapa.concluida .nome { color: var(--g-mid); }
  .etapa.concluida .depto { color: #A6B56D; }
  .etapa.concluida .depto-lbl, .etapa.concluida .dias { color: #9A9A9A; }
  .etapa.concluida .num { background: #DAE5B0; color: var(--g-mid); }
  .etapa.concluida .ponto { background: #B4C086; }

  /* branco com verde — em andamento, drawer fechado (clique para abrir) */
  .etapa.andamento { background: linear-gradient(180deg, #FFFFFF 0%, #F7F7F7 100%); border: 2px solid var(--g); }
  .etapa.andamento .nome { color: var(--g-mid); }
  .etapa.andamento .depto { color: #5C5B5B; }
  .etapa.andamento .depto-lbl, .etapa.andamento .dias { color: #9A9A9A; }
  .etapa.andamento .num { background: var(--g); color: #FFFFFF; }
  .etapa.andamento .ponto { background: #7E7F79; }

  /* verde escuro — em andamento com o drawer aberto */
  .etapa.andamento.aberta { background: linear-gradient(180deg, #ADC84A 0%, #8FAA31 100%); border-color: var(--g-stroke); }
  .etapa.andamento.aberta .nome, .etapa.andamento.aberta .depto { color: #FFFFFF; }
  .etapa.andamento.aberta .depto-lbl, .etapa.andamento.aberta .dias { color: #DFF19C; }
  .etapa.andamento.aberta .num { background: var(--g-stroke); }

  /* branco — etapa não habilitada para tramitar */
  .etapa.bloqueada { background: linear-gradient(180deg, #FFFFFF 0%, #F4F4F4 100%); border: 1px solid var(--fld-bd); }
  .etapa.bloqueada .nome, .etapa.bloqueada .depto { color: var(--txt); }
  .etapa.bloqueada .depto-lbl, .etapa.bloqueada .dias { color: #9A9A9A; }
  .etapa.bloqueada .num { background: #7E7F79; color: #FFFFFF; }
  .etapa.bloqueada .ponto { background: #7E7F79; }

  /* hover: só cresce e volta ao tamanho original, sem oscilar */
  .etapa:hover {
    transform: scale(1.04);
    box-shadow: 0 6px 18px rgba(93,106,56,.28);
    z-index: 3;
  }
  .etapa.sel { outline: 2px solid var(--g); outline-offset: 3px; }

  /* -------------------------------- drawer -------------------------------- */
  /* fechado, o drawer fica deslocado para fora e com margem negativa, para que a
     área do BPMN ocupe toda a largura; `.aberto` desfaz os dois ao mesmo tempo */
  /* ocupa metade do modal; fechado, a margem negativa devolve essa metade ao fluxo */
  .drawer {
    flex: 0 0 50%;
    background: #FFFFFF;
    border-left: 1px solid var(--fld-bd);
    display: flex; flex-direction: column;
    overflow: hidden;

    margin-right: -50%;
    transform: translateX(100%);
    opacity: 0;
    pointer-events: none;
    transition: transform .28s ease, margin-right .28s ease, opacity .2s ease;
  }
  .drawer.aberto {
    margin-right: 0;
    transform: none;
    opacity: 1;
    pointer-events: auto;
  }

  /* troca de etapa com o drawer já aberto: recua um pouco à direita e volta com
     o novo conteúdo. Precisa vir depois de .aberto para vencer o `transform: none` */
  .drawer.trocando {
    transform: translateX(26px);
    opacity: .5;
    transition: transform .15s ease-in, opacity .15s ease-in;
  }

  @media (prefers-reduced-motion: reduce) {
    .drawer { transition-duration: .01ms; }
  }

  .drawer-topo { flex: 0 0 auto; padding: 20px 20px 0; position: relative; }
  .drawer-topo .bt-fechar { position: absolute; top: 11px; right: 11px; background: #FFFFFF; border-color: var(--fld-bd); color: var(--txt); }
  .drawer-titulo { display: flex; align-items: center; gap: 10px; }
  .drawer-titulo .num {
    width: 29px; height: 29px; flex: 0 0 29px; border-radius: 50%;
    background: var(--g); color: #FFFFFF;
    display: grid; place-items: center; font-size: 13px; font-weight: bold;
  }
  .drawer-titulo h3 { margin: 0; font-size: 14px; font-weight: bold; color: var(--g-mid); }

  .drawer-abas { display: flex; margin-top: 19px; }
  .drawer-abas button {
    flex: 1; border: 0; background: none;
    padding: 0 0 10px;
    font-size: 12px; font-weight: bold; color: var(--txt-mute2);
    border-bottom: 1px solid var(--fld-bd);
    transition: color .15s ease, border-color .15s ease;
  }
  /* hover sem trocar a espessura da linha, para a aba não pular */
  .drawer-abas button:not(.ativa):hover { color: var(--g-mid); border-bottom-color: var(--g-line); }
  .drawer-abas button.ativa {
    color: var(--g-mid);
    border-bottom: 5px solid var(--g-line);
    padding-bottom: 6px;
  }

  .drawer-corpo { flex: 1; min-height: 0; overflow: auto; padding: 14px 20px; display: flex; flex-direction: column; gap: 10px; }

  .drawer-rodape {
    flex: 0 0 50px;
    display: flex; align-items: center; justify-content: flex-end; gap: 10px;
    padding: 0 10px;
    background: #FFFFFF;
    border-top: 1px solid #EEEFF1;
  }

  /* checklist */
  .checklist { border: 1px solid var(--fld-bd); border-radius: 4px; overflow: hidden; }
  .checklist .lin {
    display: grid; grid-template-columns: 38px 58px 1fr; align-items: center;
    height: 32px; padding: 0 10px; font-size: 12px; color: var(--txt);
    cursor: pointer; background: #FFFFFF;
  }
  .checklist .lin.cab { background: #E4E4E4; font-weight: bold; cursor: default; }
  .checklist .lin.destaque { background: #E1EEAF; }
  .checklist .lin.cinza { background: #F7F7F6; }
  .checklist .lin:not(.cab):hover { background: #F1F5E4; }
  .checklist input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--g); margin: 0; }

  .vazio { padding: 24px; text-align: center; color: var(--txt-mute); font-size: 12px; }
</style>
</head>
<body>

<div class="app"></div>

<script src="assets/shell.js"></script>
<script>
/* ícone "timer" do Lucide (lucide.dev/icons/timer), traçado oficial */
Object.assign(ICO, {
  cronometro: '<line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/>',
});

/* ------------------------------ dados do fluxo ------------------------------ */

/**
 * estado do card:
 *   concluida  verde claro   — etapa concluída
 *   andamento  branco+verde  — em andamento; vira verde escuro (.aberta) com o drawer aberto
 *   bloqueada  branco        — não habilitada para tramitar
 */
const ETAPAS = [
  { n: 1, nome: 'Início',                       depto: 'Arrecadação',                dias: '1 dia',  estado: 'concluida',
    x: 232, y: 15,  w: 124, h: 95 },
  { n: 2, nome: 'Conferência da<br>Solicitação', depto: 'DEPARTAMENTO DE IPTU - PD',  dias: '2 dias', estado: 'concluida',
    x: 200, y: 157, w: 188, h: 112 },
  { n: 3, nome: 'Valor exige análise<br>ampliada?', depto: 'TRIBUTAÇÃO',             dias: '1 dia',  estado: 'andamento',
    x: 0,   y: 345, w: 190, h: 112 },
  { n: 4, nome: 'Parecer do Controle<br>interno', depto: 'Controle Interno',         dias: '1 dia',  estado: 'andamento',
    x: 396, y: 345, w: 198, h: 112 },
  { n: 5, nome: 'Conferência<br>documental',    depto: 'TRIBUTOS',                   dias: '1 dia',  estado: 'bloqueada',
    x: 0,   y: 533, w: 190, h: 112 },
  { n: 6, nome: 'Declaração de<br>Impacto de ORC', depto: 'Contabilidade',           dias: '5 dias', estado: 'bloqueada',
    x: 200, y: 721, w: 198, h: 112 },
  { n: 7, nome: 'Análise Social',               depto: 'Assistência Social',         dias: '3 dias', estado: 'bloqueada',
    x: 200, y: 909, w: 198, h: 112 },
  { n: 8, nome: 'Isenção Concedida',            depto: 'Controle Interno',           dias: '1 dia',  estado: 'bloqueada',
    x: 200, y: 1097, w: 198, h: 112 },
];

/* campos da aba Dados, na ordem do protótipo */
const DADOS = [
  { rot: 'Id',                  val: '15',      ro: true },
  { rot: 'Etapa*',              cod: '3', val: 'Valor exige análise amplia...', ro: true, lupa: true },
  { rot: 'Geração*',            val: '1',       ro: true },
  { rot: 'Status*',             val: 'Não iniciada' },
  { rot: 'Data Início',         val: '01/01/2026 - 00:00:00' },
  { rot: 'Data Conclusão',      val: '01/01/2026 - 00:00:00' },
  { rot: 'Data Prevista',       val: '14/03/2026' },
  { rot: 'Concluído por',       cod: '', val: 'Pesquisar', ro: true, lupa: true },
  { rot: 'Resultado da decisão', val: '' },
];

const CHECKLIST = [
  { id: '21', situacao: 'Concluído',      classe: '' },
  { id: '22', situacao: 'Não Preenchido', classe: 'destaque' },
  { id: '23', situacao: 'Não Preenchido', classe: '' },
  { id: '24', situacao: 'Não Preenchido', classe: 'cinza' },
];

const ITENS_CHECKLIST = {
  '21': 'O objeto está devidamente descrito',
  '22': 'A justificativa da contrata...',
  '23': 'A dotação orçamentária foi informada',
  '24': 'O prazo de execução está definido',
};

/* --------------------------------- estado --------------------------------- */

let etapaSel = null;       // etapa aberta no drawer (null = drawer fechado)
let abaDrawer = 'dados';   // dados | documentos | checklist | condicoes
let itemChecklist = null;  // id do item aberto em detalhe

/* --------------------------------- BPMN --------------------------------- */

function etapaHTML(e) {
  return `
  <div class="etapa ${e.estado}" data-n="${e.n}"
       style="left:${e.x}px; top:${e.y}px; width:${e.w}px; height:${e.h}px">
    <span class="num">${e.n}</span>
    <span class="dias">${svg('cronometro')}${e.dias}</span>
    <span class="nome">${e.nome}</span>
    <span class="rodape">
      <span class="depto-lbl">DEPTO</span>
      <span class="depto">${e.depto}</span>
    </span>
    <span class="ponto"></span>
  </div>`;
}

const RAIO_CURVA = 10;

/** Caminho ortogonal com as quinas arredondadas em `r` px. */
function caminho(pts, r = RAIO_CURVA) {
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const [xa, ya] = pts[i - 1], [x, y] = pts[i], [xb, yb] = pts[i + 1];
    const da = Math.hypot(x - xa, y - ya), db = Math.hypot(xb - x, yb - y);
    const rr = Math.min(r, da / 2, db / 2);
    // entra na quina, curva usando o vértice como controle, e sai
    d += ` L${x - (x - xa) / da * rr},${y - (y - ya) / da * rr}`;
    d += ` Q${x},${y} ${x + (xb - x) / db * rr},${y + (yb - y) / db * rr}`;
  }
  const [xf, yf] = pts[pts.length - 1];
  return `${d} L${xf},${yf}`;
}

/* as linhas que saem dos cards verde-claro (etapas 1 e 2) usam #B4C086; as que
   saem dos demais ficam cinza, como no protótipo */
function conectoresHTML() {
  const feito = '#B4C086', falta = '#7E7F79';

  const ligacoes = [
    // 1 -> 2
    { pts: [[294, 113], [294, 157]], cor: feito, seta: 'pf' },
    // 2 -> 3 e 2 -> 4
    { pts: [[294, 272], [294, 308], [95, 308], [95, 345]], cor: feito, seta: 'pf' },
    { pts: [[294, 308], [495, 308], [495, 345]],           cor: feito, seta: 'pf' },
    // 3 -> 5 (logo abaixo)
    { pts: [[95, 460], [95, 533]], cor: falta, seta: 'pp' },
    // 5 -> 6 e 4 -> 6 (a de 4 desce até a mesma altura)
    { pts: [[95, 648], [95, 688], [299, 688], [299, 721]], cor: falta, seta: 'pp' },
    { pts: [[495, 460], [495, 688], [299, 688]],           cor: falta },
    // 6 -> 7 -> 8
    { pts: [[299, 836], [299, 909]],  cor: falta, seta: 'pp' },
    { pts: [[299, 1024], [299, 1097]], cor: falta, seta: 'pp' },
  ];

  const linhas = ligacoes.map(l =>
    `<path d="${caminho(l.pts)}" fill="none" stroke="${l.cor}" stroke-width="1"
           stroke-linejoin="round" ${l.seta ? `marker-end="url(#${l.seta})"` : ''}/>`).join('');

  return `
  <svg class="conectores" viewBox="0 0 594 1260">
    <defs>
      <marker id="pf" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
        <polygon points="0,0 7,3.5 0,7" fill="${feito}"/>
      </marker>
      <marker id="pp" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
        <polygon points="0,0 7,3.5 0,7" fill="${falta}"/>
      </marker>
    </defs>
    ${linhas}
  </svg>`;
}

/* -------------------------------- drawer -------------------------------- */

function campoHTML({ rot, val = '', cod, ro = false, lupa = false, area = false }) {
  const codBox = cod !== undefined ? `<input class="cx cod ro" value="${cod}" readonly>` : '';
  const entrada = area
    ? `<textarea class="cx" rows="4"></textarea>`
    : `<input class="cx${ro ? ' ro' : ''}" value="${val}" ${ro ? 'readonly' : ''}>`;
  return `
    <div class="campo"${area ? ' style="min-height:96px"' : ''}>
      <div class="rot">${rot}</div>
      <div class="val">
        ${codBox}${entrada}
        ${lupa ? `<button class="act" title="Pesquisar">${svg('lupa')}</button>` : ''}
      </div>
    </div>`;
}

function corpoDados() {
  return DADOS.map(campoHTML).join('');
}

function corpoDocumentos() {
  return campoHTML({ rot: 'Id', val: '15', ro: true }) +
    `<div class="checklist"><div class="vazio">Nenhum documento vinculado a esta etapa.</div></div>`;
}

function corpoChecklist() {
  if (itemChecklist) {
    const item = CHECKLIST.find(c => c.id === itemChecklist);
    return `
      <div style="display:flex;align-items:center;gap:10px">
        <button class="bt-fechar" style="background:#fff;border-color:var(--fld-bd);color:var(--txt)"
                onclick="itemChecklist=null;atualizarDrawer()" title="Voltar">${svg('voltar')}</button>
        <span style="font-size:11px">Voltar</span>
        <div style="flex:1"></div>
        <button class="btn btn-primario btn-mini">Salvar</button>
      </div>
      ${campoHTML({ rot: 'Id', val: item.id, ro: true })}
      ${campoHTML({ rot: 'Item*', cod: '2', val: ITENS_CHECKLIST[item.id], ro: true, lupa: true })}
      ${campoHTML({ rot: 'Situação*', val: item.situacao })}
      ${campoHTML({ rot: 'Anotações', area: true })}`;
  }

  const linhas = CHECKLIST.map(c => `
    <div class="lin ${c.classe}" onclick="itemChecklist='${c.id}';atualizarDrawer()">
      <input type="checkbox" ${c.situacao === 'Concluído' ? 'checked' : ''} onclick="event.stopPropagation()">
      <span>${c.id}</span><span>${c.situacao}</span>
    </div>`).join('');

  return `
    <div class="checklist">
      <div class="lin cab"><span></span><span>ID</span><span>SITUAÇÃO</span></div>
      ${linhas}
    </div>`;
}

function corpoCondicoes() {
  return `<div class="checklist"><div class="vazio">Nenhuma condição cadastrada para esta etapa.</div></div>`;
}

const ABAS_DRAWER = [
  { id: 'dados',      rot: 'Dados',      corpo: corpoDados },
  { id: 'documentos', rot: 'Documentos', corpo: corpoDocumentos },
  { id: 'checklist',  rot: 'Checklist',  corpo: corpoChecklist },
  { id: 'condicoes',  rot: 'Condições',  corpo: corpoCondicoes },
];

/**
 * Conteúdo interno do drawer. O elemento <aside class="drawer"> fica sempre no
 * DOM — só o que está dentro dele é refeito — para que a classe `.aberto` possa
 * animar a entrada e a saída.
 */
function atualizarDrawer() {
  const e = ETAPAS.find(x => x.n === etapaSel);
  if (!e) return;

  const abas = ABAS_DRAWER.map(a => `
    <button class="${a.id === abaDrawer ? 'ativa' : ''}" onclick="trocarAba('${a.id}')">${a.rot}</button>`).join('');
  const corpo = ABAS_DRAWER.find(a => a.id === abaDrawer).corpo();

  main.querySelector('.drawer').innerHTML = `
    <div class="drawer-topo">
      <button class="bt-fechar" onclick="fecharDrawer()" title="Fechar">${svg('x')}</button>
      <div class="drawer-titulo">
        <span class="num">${e.n}</span>
        <h3>${e.nome.replace(/<br>/g, ' ')}</h3>
      </div>
      <div class="drawer-abas">${abas}</div>
    </div>
    <div class="drawer-corpo scroll">${corpo}</div>
    <div class="drawer-rodape">
      <button class="btn ${e.estado === 'andamento' ? 'btn-claro' : 'btn-neutro'}"
              ${e.estado === 'andamento' ? '' : 'disabled'}>${svg('check')} Concluir etapa</button>
      <button class="btn btn-primario">${svg('gerais')} Operações</button>
    </div>`;
}

/* --------------------------------- ações --------------------------------- */

/* devem acompanhar as transições do .drawer e do .drawer.trocando no CSS */
const ANIM_DRAWER = 280;
const ANIM_TROCA = 150;
let limpezaDrawer = null;

/**
 * Navegação do fluxograma por clique e arraste, no lugar das barras de rolagem.
 * Um arraste acima do limiar cancela o clique, para não abrir o drawer sem querer.
 */
const LIMIAR_ARRASTO = 8;   // px de tolerância ao tremor da mão no clique

/**
 * A abertura da etapa acontece no `pointerup`, não no evento `click`: com a
 * captura de ponteiro ativa o clique é redirecionado para o container e nunca
 * chegaria ao card. Pelo mesmo motivo a captura só é pedida quando o arraste
 * realmente começa.
 */
function ativarArrasto(wrap) {
  let ativo = false, passou = false, rolou = false, alvo = null;
  let x0 = 0, y0 = 0, sl = 0, st = 0;

  wrap.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    ativo = true; passou = false; rolou = false;
    alvo = e.target.closest('.etapa');
    x0 = e.clientX; y0 = e.clientY;
    sl = wrap.scrollLeft; st = wrap.scrollTop;
  });

  wrap.addEventListener('pointermove', e => {
    if (!ativo) return;
    const dx = e.clientX - x0, dy = e.clientY - y0;
    if (!passou) {
      if (Math.hypot(dx, dy) < LIMIAR_ARRASTO) return;   // ainda pode virar clique
      passou = true;
      wrap.classList.add('arrastando');
      // mantém o arraste vivo fora da área; se falhar, o arraste segue mesmo assim
      try { wrap.setPointerCapture(e.pointerId); } catch { /* ponteiro indisponível */ }
    }
    wrap.scrollLeft = sl - dx;
    wrap.scrollTop  = st - dy;
    // só vira arraste de verdade se a tela saiu do lugar
    if (wrap.scrollLeft !== sl || wrap.scrollTop !== st) rolou = true;
  });

  const encerrar = e => {
    if (!ativo) return false;
    ativo = false;
    wrap.classList.remove('arrastando');
    if (wrap.hasPointerCapture(e.pointerId)) wrap.releasePointerCapture(e.pointerId);
    return true;
  };

  wrap.addEventListener('pointerup', e => {
    if (!encerrar(e)) return;
    if (!rolou && alvo) abrirEtapa(+alvo.dataset.n);
    alvo = null;
  });

  wrap.addEventListener('pointercancel', e => { encerrar(e); alvo = null; });
}

/** Traz a etapa para o centro da área visível do fluxograma. */
function centralizarEtapa(n) {
  const wrap = main.querySelector('.bpmn-wrap');
  const bpmn = main.querySelector('.bpmn');
  const card = main.querySelectorAll('.etapa')[ETAPAS.findIndex(e => e.n === n)];
  if (!wrap || !card) return;

  // offsetLeft/offsetTop ignoram o scale do hover, ao contrário de getBoundingClientRect
  const x = bpmn.offsetLeft + card.offsetLeft + card.offsetWidth / 2;
  const y = bpmn.offsetTop  + card.offsetTop  + card.offsetHeight / 2;
  wrap.scrollTo({
    left: x - wrap.clientWidth / 2,
    top:  y - wrap.clientHeight / 2,
    behavior: 'smooth',
  });
}

/**
 * Clique numa etapa. Com o drawer fechado, ele entra deslizando pela direita;
 * já aberto em outra etapa, recua um pouco e volta com o novo conteúdo.
 */
function abrirEtapa(n) {
  clearTimeout(limpezaDrawer);
  const drawer = main.querySelector('.drawer');
  const trocando = drawer.classList.contains('aberto') && etapaSel !== null && etapaSel !== n;

  // o realce do card muda na hora, para o clique ter resposta imediata.
  // .aberta (verde escuro) só faz sentido para quem está em andamento
  main.querySelectorAll('.etapa').forEach((el, i) => {
    const desta = ETAPAS[i].n === n;
    el.classList.toggle('sel', desta);
    el.classList.toggle('aberta', desta && ETAPAS[i].estado === 'andamento');
  });

  const aplicar = () => { etapaSel = n; itemChecklist = null; atualizarDrawer(); };

  if (!trocando) {
    aplicar();
    drawer.classList.add('aberto');
    // só depois que o drawer terminou de entrar a área do fluxo tem a largura final
    setTimeout(() => centralizarEtapa(n), ANIM_DRAWER);
    return;
  }

  drawer.classList.add('trocando');
  setTimeout(() => {
    aplicar();
    drawer.classList.remove('trocando');
    centralizarEtapa(n);   // a largura não mudou: já dá para centralizar
  }, ANIM_TROCA);
}

function trocarAba(id) { abaDrawer = id; itemChecklist = null; atualizarDrawer(); }

/** Fecha o drawer com o movimento inverso; só esvazia o conteúdo ao fim da animação. */
function fecharDrawer() {
  const drawer = main.querySelector('.drawer');
  drawer.classList.remove('aberto');
  main.querySelectorAll('.etapa').forEach(el => el.classList.remove('sel', 'aberta'));

  clearTimeout(limpezaDrawer);
  limpezaDrawer = setTimeout(() => {
    if (drawer.classList.contains('aberto')) return;  // reaberto durante a animação
    etapaSel = null;
    drawer.innerHTML = '';
  }, ANIM_DRAWER);
}

function fecharModal() { location.href = 'po002.html?view=cadastro'; }

/* --------------------------------- render --------------------------------- */

/** Monta a tela uma única vez; depois só o drawer muda. */
function render() {
  main.insertAdjacentHTML('beforeend', `
    <div class="tela">
      <div class="vtabs">
        <button class="vtab" onclick="location.href='po002.html'">${svg('lupa')}<span>Pesquisa</span></button>
        <button class="vtab ativa" onclick="location.href='po002.html?view=cadastro'">${svg('lapis')}<span>Cadastro</span></button>
        <button class="vtab">${svg('notas')}<span>Notas</span></button>
        <button class="vtab">${svg('robo')}<span>ViCenti</span></button>
      </div>
      <div class="conteudo">
        <div class="fundo">
          <div class="painel filtros"></div>
          <div class="painel resultado"></div>
        </div>
      </div>

      <div class="modal-overlay" onclick="if(event.target===this)fecharModal()">
        <div class="modal">
          <div class="modal-topo">
            <span class="chip">2292408</span>
            <h2>Fluxo de Aquisição de Material</h2>
            <div style="flex:1"></div>
            <button class="bt-fechar" onclick="fecharModal()" title="Fechar">${svg('x')}</button>
          </div>
          <div class="modal-corpo">
            <div class="bpmn-wrap">
              <div class="bpmn">
                ${conectoresHTML()}
                ${ETAPAS.map(etapaHTML).join('')}
              </div>
            </div>
            <aside class="drawer"></aside>
          </div>
        </div>
      </div>
    </div>`);
}

const main = montarShell('po011', ['protocolo','po002','po011']);
render();
ativarArrasto(main.querySelector('.bpmn-wrap'));

/* a tela abre sem drawer; ?etapa=3&aba=checklist&item=22 permite entrar direto numa etapa */
const q = new URLSearchParams(location.search);
if (ABAS_DRAWER.some(a => a.id === q.get('aba'))) abaDrawer = q.get('aba');
if (CHECKLIST.some(c => c.id === q.get('item'))) itemChecklist = q.get('item');
if (q.get('etapa') && ETAPAS.some(e => e.n === +q.get('etapa'))) {
  const n = +q.get('etapa');
  abrirEtapa(n);
  if (CHECKLIST.some(c => c.id === q.get('item'))) { itemChecklist = q.get('item'); atualizarDrawer(); }
}
</script>
</body>
