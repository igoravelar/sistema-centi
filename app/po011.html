<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centi · PO011 - Central de Protocolos</title>
<link rel="icon" type="image/svg+xml" href="assets/img/ico-favicon-centi-prototipo.svg">
<link rel="stylesheet" href="assets/centi.css?v=8">
<link rel="stylesheet" href="assets/fluxo.css?v=13">
<style>
  /* fundo: a tela do PO002 esmaecida sob o modal */
  .fundo { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
  .fundo .painel.filtros   { height: 164px; }

  /* ------------------------------- modal ------------------------------- */
  /* o inset é medido a partir do padding box do .main, por isso soma a moldura */
  .modal-overlay {
    position: absolute;
    inset: calc(var(--moldura) + var(--tab-h)) var(--moldura) var(--moldura) calc(var(--moldura) + 30px);
    background: rgba(0,0,0,.4);
    border-radius: 5px;
    display: flex; align-items: stretch;
    padding: 20px;
    z-index: 10;
  }
  .modal {
    flex: 1; min-width: 0;
    background: var(--modal-bg);
    border-radius: 5px;
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  .modal-topo {
    flex: 0 0 41px;
    display: flex; align-items: center; gap: 10px;
    padding: 0 10px;
    background: #FFFFFF;
    border-bottom: 1px solid var(--g-soft-bd2);
    border-radius: 5px 5px 0 0;
  }
  .modal-topo .chip {
    height: 21px; padding: 0 8px;
    border: 1px solid var(--tab-bd); border-radius: 4px;
    background: #FFFFFF;
    font-size: 11px; font-weight: bold; color: var(--txt);
    display: grid; place-items: center;
  }
</style>
</head>
<body>

<div class="app"></div>

<script src="assets/shell.js?v=9"></script>
<script src="assets/fluxo.js?v=8"></script>
<script>
function fecharModal() { location.href = 'po002.html?view=cadastro'; }

const main = montarShell('po011');

main.insertAdjacentHTML('beforeend', `
  <div class="tela">
    <div class="vtabs">
      <button class="vtab" onclick="location.href='po002.html'">${svg('lupa')}<span>Pesquisa</span></button>
      <button class="vtab ativa" onclick="location.href='po002.html?view=cadastro'">${svg('lapis')}<span>Cadastro</span></button>
      <button class="vtab">${svg('notas')}<span>Notas</span></button>
      <button class="vtab">${svg('robo')}<span>ViCenti</span></button>
    </div>
    <div class="conteudo">
      <div class="fundo">
        <div class="painel filtros"></div>
        <div class="painel resultado"></div>
      </div>
    </div>

    <div class="modal-overlay" onclick="if(event.target===this)fecharModal()">
      <div class="modal">
        <div class="modal-topo">
          <span class="chip">2292408</span>
          <h2>Fluxo de Aquisição de Material</h2>
          <div style="flex:1"></div>
          <button class="bt-fechar" onclick="fecharModal()" title="Fechar">${svg('x')}</button>
        </div>
        <div class="fluxo"></div>
      </div>
    </div>
  </div>`);

montarFluxo(main.querySelector('.fluxo'));
</script>
</body>
</html>
